async function renderAdminUsers(){
  const adminEl = $('admin-content');
  try {
    const snap = await db.collection('usernames').get();
    const users = [];
    snap.forEach(doc => {
      const d = doc.data();
      users.push({ username: doc.id, email: d.email || '-', uid: d.uid || '-' });
    });
    users.sort((a, b) => a.username.localeCompare(b.username));
    if (users.length === 0) { adminEl.innerHTML = '<p>등록된 사용자가 없습니다.</p>'; return; }
    let duplicates = {};
    users.forEach(u => {
      const stuId = u.username.split('_')[0];
      if (!duplicates[stuId]) duplicates[stuId] = [];
      duplicates[stuId].push(u);
    });
    const dupWarnings = Object.entries(duplicates).filter(([,v]) => v.length > 1);
    let html = dupWarnings.length > 0 ? `<div style="background:var(--fail-bg);border:1px solid var(--fail);border-radius:8px;padding:0.8rem 1rem;margin-bottom:1rem">
      <b style="color:var(--fail)">중복 의심 (${dupWarnings.length}건)</b><br>` +
      dupWarnings.map(([id, arr]) => `학번 ${escapeHtml(id)}: ${arr.map(a => escapeHtml(a.username) + ' ('+escapeHtml(a.email)+')').join(', ')}`).join('<br>') + '</div>' : '';
    html += `<p style="color:var(--text3);margin-bottom:0.5rem">총 ${users.length}명 등록</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px">
    <thead><tr style="border-bottom:2px solid var(--border)">
      <th style="padding:8px 12px;text-align:left">#</th>
      <th style="padding:8px 12px;text-align:left">학번_이름</th>
      <th style="padding:8px 12px;text-align:left">Google 이메일</th>
      <th style="padding:8px 12px;text-align:left">상태</th>
      <th style="padding:8px 12px;text-align:left"></th>
    </tr></thead><tbody>` +
    users.map((u, i) => {
      const stuId = u.username.split('_')[0];
      const isDup = duplicates[stuId] && duplicates[stuId].length > 1;
      return `<tr style="border-bottom:1px solid var(--border);${isDup ? 'background:var(--fail-bg)' : ''}">
        <td style="padding:8px 12px;color:var(--text3)">${i+1}</td>
        <td style="padding:8px 12px;font-weight:500">${escapeHtml(u.username)}</td>
        <td style="padding:8px 12px;font-family:monospace;font-size:13px">${escapeHtml(u.email)}</td>
        <td style="padding:8px 12px">${isDup ? '<span style="color:var(--fail);font-weight:600">중복 의심</span>' : '<span style="color:var(--accent)">정상</span>'}</td>
        <td style="padding:8px 12px"><button onclick="adminDeleteUser('${escapeHtml(u.username)}')"
          style="font-size:11px;padding:2px 8px;color:var(--error);border-color:var(--fail-badge-bg)">삭제</button></td>
      </tr>`;
    }).join('') + '</tbody></table>';
    adminEl.innerHTML = html;
  } catch(e) {
    adminEl.innerHTML = '<p style="color:var(--fail)">사용자 목록을 불러올 수 없습니다. Firestore 보안규칙을 확인하세요.</p>';
  }
}

async function renderAdminSubmissions(){
  const adminEl = $('admin-content');
  adminEl.innerHTML = '<p>제출 데이터 불러오는 중...</p>';
  try {
    const r = await fetch(SHEETS_URL + '?mode=admin&key=' + SHEETS_KEY, { method:'GET', mode:'cors' });
    if (!r.ok) throw new Error('fetch failed');
    const d = await r.json();
    if (!d.submissions || d.submissions.length === 0) {
      adminEl.innerHTML = '<p>제출 데이터가 없습니다.</p>';
      return;
    }
    const subs = d.submissions;
    // problem list by week (based on PROBLEMS)
    const weekGroups = {};
    PROBLEMS.forEach(p => {
      if (!weekGroups[p.week]) weekGroups[p.week] = [];
      weekGroups[p.week].push(p);
    });
    // best score mapping per student: { username: { pid: { score, max, ts } } }
    const bestByUser = {};
    subs.forEach(s => {
      if (!bestByUser[s.username]) bestByUser[s.username] = {};
      const prev = bestByUser[s.username][s.pid];
      const sScore = !isNaN(Number(s.score)) ? Number(s.score) : null;
      const pScore = prev ? (!isNaN(Number(prev.score)) ? Number(prev.score) : null) : null;
      if (!prev || (sScore !== null && (pScore === null || sScore > pScore))) {
        bestByUser[s.username][s.pid] = { score: sScore, max: Number(s.max)||0, ts: s.ts };
      }
    });
    const students = Object.keys(bestByUser).sort();
    // week filter
    const weeks = Object.keys(weekGroups);
    let html = `<div style="margin-bottom:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--text3)">주차 필터:</span>
      <button onclick="document.querySelectorAll('.admin-week').forEach(e=>e.style.display='')" style="font-size:12px;padding:4px 10px">전체</button>`;
    weeks.forEach((w,i) => {
      html += `<button onclick="document.querySelectorAll('.admin-week').forEach(e=>e.style.display='none');document.querySelectorAll('.admin-week-${i}').forEach(e=>e.style.display='')" style="font-size:12px;padding:4px 10px">${w}</button>`;
    });
    html += `</div><p style="color:var(--text3);margin-bottom:0.5rem">총 ${students.length}명 제출</p>`;
    weeks.forEach((w,wi) => {
      const probs = weekGroups[w];
      html += `<div class="admin-week admin-week-${wi}" style="margin-bottom:1.5rem">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:0.5rem;color:var(--text)">${w}</h3>
        <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:${200+probs.length*100}px">
        <thead><tr style="border-bottom:2px solid var(--border)">
          <th style="padding:6px 10px;text-align:left;position:sticky;left:0;background:var(--surface);z-index:1">학번_이름</th>`;
      probs.forEach(p => {
        html += `<th style="padding:6px 10px;text-align:center;font-size:12px" title="${p.title}">${p.id}</th>`;
      });
      html += `<th style="padding:6px 10px;text-align:center">합계</th></tr></thead><tbody>`;
      students.forEach(stu => {
        let total = 0, maxTotal = 0, hasAny = false;
        probs.forEach(p => {
          if (bestByUser[stu][p.id]) { hasAny = true; }
        });
        if (!hasAny) return;
        html += `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:6px 10px;font-weight:500;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1">${stu}</td>`;
        probs.forEach(p => {
          const b = bestByUser[stu][p.id];
          if (b) {
            const pct = (b.score !== null && b.max > 0) ? b.score / b.max : 0;
            const color = pct >= 1 ? 'var(--accent)' : pct >= 0.5 ? 'var(--partial)' : 'var(--fail)';
            const scoreLabel = b.score !== null ? `${b.score}/${b.max}` : '?';
            html += `<td style="padding:6px 10px;text-align:center;color:${color};font-weight:500" title="${b.ts}">${scoreLabel}</td>`;
            total += b.score; maxTotal += b.max;
          } else {
            html += `<td style="padding:6px 10px;text-align:center;color:var(--text4)">-</td>`;
            maxTotal += (p.cases||[]).reduce((s,c)=>s+c.pts,0);
          }
        });
        const tPct = maxTotal > 0 ? total / maxTotal : 0;
        const tColor = tPct >= 1 ? 'var(--accent)' : tPct >= 0.5 ? 'var(--partial)' : 'var(--fail)';
        html += `<td style="padding:6px 10px;text-align:center;font-weight:600;color:${tColor}">${total}/${maxTotal}</td></tr>`;
      });
      html += '</tbody></table></div></div>';
    });
    adminEl.innerHTML = html;
  } catch(e) {
    adminEl.innerHTML = '<p style="color:var(--fail)">제출 데이터를 불러올 수 없습니다. Sheets doGet에 admin 모드가 설정되어 있는지 확인하세요.</p>';
  }
}

/* Register studentId_name on first login (duplicate prevention) */
async function doRegisterName(cb){
  const v = prompt('학번_이름 형식으로 입력하세요\n예) 202312345_홍길동');
  if (!v || !v.trim()) return;
  const newName = v.trim();
  // duplicate check: whether another account already uses the same studentId_name
  try {
    const existing = await db.collection('usernames').doc(newName).get();
    if (existing.exists && existing.data().uid !== firebaseUser.uid) {
      alert('이미 다른 계정에서 사용 중인 학번_이름입니다.\n본인의 학번_이름이 맞다면 교수님께 문의하세요.');
      return;
    }
  } catch(e){}
  const oldName = username;
  username = newName;
  localStorage.setItem(LS_USER, username);
  try {
    // save profile to users collection
    // initialize approved:false only for new docs (preserve existing approval status)
    const userRef = db.collection('users').doc(firebaseUser.uid);
    const userDoc = await userRef.get();
    const payload = { username, email: firebaseUser.email, updatedAt: new Date().toISOString() };
    if (!userDoc.exists) payload.approved = false;
    await userRef.set(payload, { merge: true });
    // store reverse mapping in usernames collection (for duplicate prevention)
    await db.collection('usernames').doc(newName).set({ uid: firebaseUser.uid, email: firebaseUser.email });
    // delete previous name mapping if it existed
    if (oldName && oldName !== newName) {
      await db.collection('usernames').doc(oldName).delete().catch(()=>{});
    }
  } catch(e){}
  if (cb) cb();
  else { history.replaceState({view:'home'}, '', ' '); renderHome(false); }
}
/* Legacy compat: doSetUser -> login if not logged in, register name if logged in but unnamed */
function doSetUser(cb){
  if (!firebaseUser) { doLogin(); return; }
  if (!username) { doRegisterName(cb); return; }
  if (cb) cb();
}
function doChangeUser(){ doRegisterName(() => renderHome()); }

/* Firebase Auth state listener */
auth.onAuthStateChanged(async (user) => {
  firebaseUser = user;
  if (user) {
    // auto-approve admin/TA
    isApproved = isAdmin() || isTA();
    // load studentId_name + approval status + history in one Firestore read
    let _mainDocData = null;
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) _mainDocData = doc.data();
      if (_mainDocData && _mainDocData.approved === true) isApproved = true;
      if (_mainDocData && _mainDocData.username) {
        username = _mainDocData.username;
        localStorage.setItem(LS_USER, username);
      } else {
        // fall back to localStorage if not in Firestore
        const local = localStorage.getItem(LS_USER);
        if (local) {
          username = local;
          try { await db.collection('users').doc(user.uid).set({ username, email: user.email }, { merge: true }); } catch(e){}
        } else {
          username = '';
        }
      }
    } catch(e) {
      username = localStorage.getItem(LS_USER) || '';
    }
    // preload mascot image URL (failures silently ignored — toast shows text only)
    if (!_mascotUrl) {
      storage.ref('mascot/mascot.jpg').getDownloadURL()
        .then(url => { _mascotUrl = url; })
        .catch(() => {});
    }
    // load history: reuse main doc data fetched above (0 extra reads)
    await loadHistoryFromMainDoc(_mainDocData);
    // if admin/TA: load private drafts + pending approval count
    await loadDrafts();
    await _loadPendingCount();
    // if admin/TA: load class progress in background (Sheets-based)
    if (isAdmin() || isTA()) {
      _loadClassProgress().then(res => {
        if (res && (view === 'home' || view === 'history')) {
          if (view === 'history') renderHistory(false);
          else renderHome(false);
        }
      });
    }
  } else {
    username = '';
    isApproved = false;
    historyCache = null;
    localStorage.removeItem(LS_USER);
    // load published drafts for guests too (loadDrafts cleans up existing entries internally)
    await loadDrafts();
  }
  renderHome(false);
});

(function(){
  let _devWarnCount = 0;
  const _devWarnMax = 3;

  function _devWarn(method){
    if (isAdmin() || isTA()) return;  // skip for admin/TA
    _devWarnCount++;
    sendToSheets({ type:'warn', ts: new Date().toISOString(), username: username||'미로그인', problemId: curPid||'', method });

    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:2rem';
    overlay.innerHTML = `<div style="background:#fff;border-radius:12px;padding:2rem;max-width:420px;text-align:center">
      <div style="font-size:48px;margin-bottom:12px">⚠️</div>
      <div style="font-size:18px;font-weight:700;color:#d32f2f;margin-bottom:8px">개발자 도구 감지</div>
      <div style="font-size:14px;color:#333;line-height:1.6">
        개발자 도구 또는 소스 보기 시도가 감지되었습니다.<br>
        <b>이 행위는 관리자에게 자동으로 기록됩니다.</b><br>
        (${username || '미로그인'} / ${_devWarnCount}회)
      </div>
      <button onclick="this.closest('div[style]').remove()" style="margin-top:16px;padding:8px 24px;
        background:#d32f2f;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">확인</button>
    </div>`;
    document.body.appendChild(overlay);
  }

  // block keyboard shortcuts
  document.addEventListener('keydown', function(e){
    // F12
    if (e.key === 'F12') { e.preventDefault(); _devWarn('F12'); return; }
    // Ctrl+Shift+I/J/C (DevTools)
    if (e.ctrlKey && e.shiftKey && ['I','i','J','j','C','c'].includes(e.key)) { e.preventDefault(); _devWarn('Ctrl+Shift+'+e.key.toUpperCase()); return; }
    // Ctrl+U (view source)
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); _devWarn('Ctrl+U'); return; }
    // Ctrl+S (save) — block silently, no warning
    if (e.ctrlKey && (e.key === 's' || e.key === 'S') && !e.shiftKey) { e.preventDefault(); return; }
  });

  // block copy in problem area (Ctrl+C / Ctrl+A)
  document.addEventListener('copy', function(e){
    if (e.target.closest('.CodeMirror') || e.target.closest('textarea') || e.target.closest('input')) return;
    if (isAdmin() || isTA()) return;
    if (e.target.closest('.prob-pane') || document.querySelector('.prob-pane')) {
      e.preventDefault();
    }
  });

  // block right-click (no warning — trackpad two-finger tap also triggers contextmenu)
  document.addEventListener('contextmenu', function(e){
    if (e.target.closest('.CodeMirror') || e.target.closest('textarea')) return;
    e.preventDefault();
  });

  // final-only: tab/window switch detection
  // NOTE: blur 리스너는 제거함 (confirm 대화상자, 주소창 클릭 등에서 오탐 발생).
  //       visibilitychange만으로 탭 전환/최소화 감지 충분.
  //       단, 다른 앱(IDE 등)으로 전환은 감지 못함 (Alt+Tab 등).
  function _examWarn(method){
    // if (isAdmin() || isTA() || window._suppressExamWarn) return;  // 테스트용 주석처리
    _devWarnCount++;
    sendToSheets({ type:'warn', ts: new Date().toISOString(), username: username||'미로그인', problemId: curPid||'', method });
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:2rem';
    overlay.innerHTML = `<div style="background:#fff;border-radius:12px;padding:2rem;max-width:420px;text-align:center">
      <div style="font-size:48px;margin-bottom:12px">⚠️</div>
      <div style="font-size:18px;font-weight:700;color:#d32f2f;margin-bottom:8px">시험 중 이탈 감지</div>
      <div style="font-size:14px;color:#333;line-height:1.6">
        시험 진행 중 다른 창/탭 이동이 감지되었습니다.<br>
        <b>이 행위는 관리자에게 자동으로 기록됩니다.</b><br>
        (${username || '미로그인'} / ${_devWarnCount}회)
      </div>
      <button onclick="this.closest('div[style]').remove()" style="margin-top:16px;padding:8px 24px;
        background:#d32f2f;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer">확인</button>

    document.body.appendChild(overlay);
  }
