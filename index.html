      const topTag = rank<=3 ? ` <span style="font-size:10px;font-weight:800;color:${color};letter-spacing:.03em;margin-left:.2rem">TOP ${rank}</span>` : '';
      slot.innerHTML = `<span style="color:var(--text3)">내 순위</span> <b style="color:${color};font-size:13px">${emoji} ${rank}위</b> <span style="color:var(--text5)">/ ${total}명 · ${count}건${topTag}</span>`;
    }, 2100);
  }
}

/* ── 제출 현황 (Sheets doGet) ── */
let _submitCounts = {};  // { problemId: count }
let _submitCountsLoaded = false;

let _leaderboard = [];
let _prevLeaderboard = JSON.parse(localStorage.getItem('oj_prev_lb') || '[]');
let _hourly = new Array(24).fill(0);  // 24시간 시간대별 제출 수
const EXCLUDE_NAMES = ['원경호'];  // TA는 순위에 포함

function rankArrow(name){
  if (!_prevLeaderboard.length) return '';
  const cur  = _leaderboard.findIndex(x => x.name === name);
  const prev = _prevLeaderboard.findIndex(x => x.name === name);
  if (prev === -1) return `<span style="font-size:9px;font-weight:700;color:var(--accent-text)">NEW</span>`;
  const diff = prev - cur;
  if (diff > 0) return `<span style="font-size:11px;color:#e53935;line-height:1">▲</span>`;
  if (diff < 0) return `<span style="font-size:11px;color:#1e88e5;line-height:1">▼</span>`;
  return '';
}

async function fetchSubmitCounts(){
  if (!SHEETS_URL) return;
  try {
    const r = await fetch(SHEETS_URL, { method:'GET', mode:'cors' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.counts) {
      _submitCounts = d.counts;
      _submitCountsLoaded = true;
    }
    if (d.leaderboard) {
      // 이전 순위 = 현재 메모리에 있으면 그걸, 없으면 localStorage에서
      _prevLeaderboard = _leaderboard.length ? _leaderboard : _prevLeaderboard;
      // 새 데이터를 다음 세션의 prev로 저장
      localStorage.setItem('oj_prev_lb', JSON.stringify(d.leaderboard));
      _leaderboard = d.leaderboard;
    }
    if (d.hourly) _hourly = d.hourly;
    if (view === 'home') renderHome(false);
  } catch {}
}

function showCode(code, title, ts){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:var(--overlay);z-index:999;display:flex;align-items:center;justify-content:center;padding:1rem';
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };

  const modal = document.createElement('div');
  modal.style.cssText = 'background:var(--surface);border-radius:12px;width:100%;max-width:720px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden';
  modal.innerHTML = `
    <div style="padding:.85rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0">
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px">${title}</div>
        <div style="font-size:12px;color:var(--text3)">${ts}</div>
      </div>
      <button style="background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);padding:0 4px">✕</button>
    </div>
    <div style="flex:1;overflow:auto;min-height:0"><textarea id="_showcode-ta"></textarea></div>`;
  modal.querySelector('button').onclick = () => overlay.remove();
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const ta = modal.querySelector('#_showcode-ta');
  ta.value = code;
  if (typeof CodeMirror !== 'undefined') {
    const cm = CodeMirror.fromTextArea(ta, {
      mode: 'text/x-csrc',
      lineNumbers: true,
      readOnly: true,
      theme: document.body.classList.contains('dark') ? 'dracula' : 'default',
      lineWrapping: false,
      viewportMargin: Infinity,
    });
    cm.getWrapperElement().style.cssText = 'font-size:12px;line-height:1.6';
    setTimeout(() => cm.refresh(), 0);
  }
}

  $('app').innerHTML = `<div class="topbar"><button class="back-btn" onclick="renderHome()">← 목록</button>

async function renderAdminDifficulty(){
  const adminEl = $('admin-content');
  adminEl.innerHTML = '<p>어려워요 데이터 불러오는 중...</p>';
  try {
    const snap = await db.collection('difficulty').get();
    const rows = [];
    snap.forEach(doc => {
      const d = doc.data() || {};
      rows.push({
        pid: doc.id,
        count: d.count || 0,
        voters: Array.isArray(d.voters) ? d.voters : []
      });
    });
    // PROBLEMS에서 제목/주차 매칭
    const pmap = {};
    PROBLEMS.forEach(p => { pmap[p.id] = p; });
    rows.forEach(r => {
      const p = pmap[r.pid];
      r.title = p ? p.title : '(삭제된 문제)';
      r.week  = p ? p.week  : '-';
    });
    // count 내림차순 정렬
    rows.sort((a, b) => b.count - a.count || a.pid.localeCompare(b.pid));

    if (rows.length === 0) {
      adminEl.innerHTML = '<p style="color:var(--text3)">아직 "어려워요"를 누른 문제가 없습니다.</p>';
      return;
    }

    const total = rows.reduce((s, r) => s + r.count, 0);
    const maxCount = rows[0].count || 1;

    let html = `<p style="color:var(--text3);margin-bottom:0.8rem">총 ${rows.length}개 문제 · 누적 ${total}회</p>
      <table style="width:100%;border-collapse:collapse;font-size:14px">
      <thead><tr style="border-bottom:2px solid var(--border)">
        <th style="padding:8px 12px;text-align:left;width:40px">#</th>
        <th style="padding:8px 12px;text-align:left;width:80px">문제 ID</th>
        <th style="padding:8px 12px;text-align:left">주차</th>
        <th style="padding:8px 12px;text-align:left">제목</th>
        <th style="padding:8px 12px;text-align:right;width:80px">카운트</th>
        <th style="padding:8px 12px;text-align:left;width:30%">분포</th>
        <th style="padding:8px 12px;text-align:left;width:60px"></th>
      </tr></thead><tbody>` +
      rows.map((r, i) => {
        const pct = Math.round((r.count / maxCount) * 100);
        const hot = r.count >= 5;
        const barColor = hot ? 'var(--fail)' : r.count >= 2 ? '#f5a623' : 'var(--text4)';
        const countStyle = hot ? 'color:var(--fail);font-weight:700' : 'font-weight:600';
        return `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:8px 12px;color:var(--text3)">${i+1}</td>
          <td style="padding:8px 12px;font-family:'Menlo','Consolas',monospace;font-size:12px;color:var(--text3)">${r.pid}</td>
          <td style="padding:8px 12px;font-size:13px;color:var(--text3)">${escapeHtml(r.week)}</td>
          <td style="padding:8px 12px">${escapeHtml(r.title)}</td>
          <td style="padding:8px 12px;text-align:right;${countStyle}">${r.count}명</td>
          <td style="padding:8px 12px">
            <div style="background:var(--surface3);border-radius:4px;height:8px;overflow:hidden">
              <div style="background:${barColor};height:100%;width:${pct}%"></div>
            </div>
          </td>
          <td style="padding:8px 12px">
            <button onclick="renderProb('${r.pid}')" style="font-size:11px;padding:2px 8px">열기</button>
          </td>
        </tr>`;
      }).join('') + '</tbody></table>';
    adminEl.innerHTML = html;
  } catch(e) {
    console.warn(e);
    adminEl.innerHTML = '<p style="color:var(--fail)">데이터를 불러올 수 없습니다: ' + escapeHtml(e.message || String(e)) + '</p>';
  }
}

async function renderAdminUsers(){
  const adminEl = $('admin-content');
  try {
    const snap = await db.collection('usernames').get();
    const users = [];
    snap.forEach(doc => {
      const d = doc.data();
      users.push({ username: doc.id, email: d.email || '-', uid: d.uid || '-' });
    });
    users.sort((a, b) => a.username.localeCompare(b.username));
    if (users.length === 0) { adminEl.innerHTML = '<p>등록된 사용자가 없습니다.</p>'; return; }
    let duplicates = {};
    users.forEach(u => {
      const stuId = u.username.split('_')[0];
      if (!duplicates[stuId]) duplicates[stuId] = [];
      duplicates[stuId].push(u);
    });
    const dupWarnings = Object.entries(duplicates).filter(([,v]) => v.length > 1);
    let html = dupWarnings.length > 0 ? `<div style="background:var(--fail-bg);border:1px solid var(--fail);border-radius:8px;padding:0.8rem 1rem;margin-bottom:1rem">
      <b style="color:var(--fail)">중복 의심 (${dupWarnings.length}건)</b><br>` +
      dupWarnings.map(([id, arr]) => `학번 ${id}: ${arr.map(a => a.username + ' ('+a.email+')').join(', ')}`).join('<br>') + '</div>' : '';
    html += `<p style="color:var(--text3);margin-bottom:0.5rem">총 ${users.length}명 등록</p>
    <table style="width:100%;border-collapse:collapse;font-size:14px">
    <thead><tr style="border-bottom:2px solid var(--border)">
      <th style="padding:8px 12px;text-align:left">#</th>
      <th style="padding:8px 12px;text-align:left">학번_이름</th>
      <th style="padding:8px 12px;text-align:left">Google 이메일</th>
      <th style="padding:8px 12px;text-align:left">상태</th>
      <th style="padding:8px 12px;text-align:left"></th>
    </tr></thead><tbody>` +
    users.map((u, i) => {
      const stuId = u.username.split('_')[0];
      const isDup = duplicates[stuId] && duplicates[stuId].length > 1;
      return `<tr style="border-bottom:1px solid var(--border);${isDup ? 'background:var(--fail-bg)' : ''}">
        <td style="padding:8px 12px;color:var(--text3)">${i+1}</td>
        <td style="padding:8px 12px;font-weight:500">${u.username}</td>
        <td style="padding:8px 12px;font-family:monospace;font-size:13px">${u.email}</td>
        <td style="padding:8px 12px">${isDup ? '<span style="color:var(--fail);font-weight:600">중복 의심</span>' : '<span style="color:var(--accent)">정상</span>'}</td>
        <td style="padding:8px 12px"><button onclick="adminDeleteUser('${u.username}')"
          style="font-size:11px;padding:2px 8px;color:var(--error);border-color:var(--fail-badge-bg)">삭제</button></td>
      </tr>`;
    }).join('') + '</tbody></table>';
    adminEl.innerHTML = html;
  } catch(e) {
    adminEl.innerHTML = '<p style="color:var(--fail)">사용자 목록을 불러올 수 없습니다. Firestore 보안규칙을 확인하세요.</p>';
  }
}

async function adminDeleteUser(uname){
  if (!confirm(`'${uname}' 등록을 삭제할까요?\n해당 사용자는 로그아웃 후 다시 등록해야 합니다.`)) return;
  try {
    await db.collection('usernames').doc(uname).delete();
    await renderAdminUsers();
  } catch(e) {
    alert('삭제 실패: ' + e.message);
  }
}

async function renderAdminSubmissions(){
  const adminEl = $('admin-content');
  adminEl.innerHTML = '<p>제출 데이터 불러오는 중...</p>';
  try {
    const r = await fetch(SHEETS_URL + '?mode=admin', { method:'GET', mode:'cors' });
    if (!r.ok) throw new Error('fetch failed');
    const d = await r.json();
    if (!d.submissions || d.submissions.length === 0) {
      adminEl.innerHTML = '<p>제출 데이터가 없습니다.</p>';
      return;
    }
    const subs = d.submissions;
    // 주차별 문제 목록 (PROBLEMS 기준)
    const weekGroups = {};
    PROBLEMS.forEach(p => {
      if (!weekGroups[p.week]) weekGroups[p.week] = [];
      weekGroups[p.week].push(p);
    });
    // 학생별 최고점 매핑: { username: { pid: { score, max, ts } } }
    const bestByUser = {};
    subs.forEach(s => {
      if (!bestByUser[s.username]) bestByUser[s.username] = {};
      const prev = bestByUser[s.username][s.pid];
      const sScore = !isNaN(Number(s.score)) ? Number(s.score) : null;
      const pScore = prev ? (!isNaN(Number(prev.score)) ? Number(prev.score) : null) : null;
      if (!prev || (sScore !== null && (pScore === null || sScore > pScore))) {
        bestByUser[s.username][s.pid] = { score: sScore, max: Number(s.max)||0, ts: s.ts };
      }
    });
    const students = Object.keys(bestByUser).sort();
    // 주차 필터
    const weeks = Object.keys(weekGroups);
    let html = `<div style="margin-bottom:1rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span style="font-size:13px;color:var(--text3)">주차 필터:</span>
      <button onclick="document.querySelectorAll('.admin-week').forEach(e=>e.style.display='')" style="font-size:12px;padding:4px 10px">전체</button>`;
    weeks.forEach((w,i) => {
      html += `<button onclick="document.querySelectorAll('.admin-week').forEach(e=>e.style.display='none');document.querySelectorAll('.admin-week-${i}').forEach(e=>e.style.display='')" style="font-size:12px;padding:4px 10px">${w}</button>`;
    });
    html += `</div><p style="color:var(--text3);margin-bottom:0.5rem">총 ${students.length}명 제출</p>`;
    weeks.forEach((w,wi) => {
      const probs = weekGroups[w];
      html += `<div class="admin-week admin-week-${wi}" style="margin-bottom:1.5rem">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:0.5rem;color:var(--text)">${w}</h3>
        <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:${200+probs.length*100}px">
        <thead><tr style="border-bottom:2px solid var(--border)">
          <th style="padding:6px 10px;text-align:left;position:sticky;left:0;background:var(--surface);z-index:1">학번_이름</th>`;
      probs.forEach(p => {
        html += `<th style="padding:6px 10px;text-align:center;font-size:12px" title="${p.title}">${p.id}</th>`;
      });
      html += `<th style="padding:6px 10px;text-align:center">합계</th></tr></thead><tbody>`;
      students.forEach(stu => {
        let total = 0, maxTotal = 0, hasAny = false;
        probs.forEach(p => {
          if (bestByUser[stu][p.id]) { hasAny = true; }
        });
        if (!hasAny) return;
        html += `<tr style="border-bottom:1px solid var(--border)">
          <td style="padding:6px 10px;font-weight:500;white-space:nowrap;position:sticky;left:0;background:var(--surface);z-index:1">${stu}</td>`;
        probs.forEach(p => {
          const b = bestByUser[stu][p.id];
          if (b) {
            const pct = (b.score !== null && b.max > 0) ? b.score / b.max : 0;
            const color = pct >= 1 ? 'var(--accent)' : pct >= 0.5 ? 'var(--partial)' : 'var(--fail)';
            const scoreLabel = b.score !== null ? `${b.score}/${b.max}` : '?';
            html += `<td style="padding:6px 10px;text-align:center;color:${color};font-weight:500" title="${b.ts}">${scoreLabel}</td>`;
            total += b.score; maxTotal += b.max;
          } else {
            html += `<td style="padding:6px 10px;text-align:center;color:var(--text4)">-</td>`;
            maxTotal += (p.cases||[]).reduce((s,c)=>s+c.pts,0);
          }
        });
        const tPct = maxTotal > 0 ? total / maxTotal : 0;
        const tColor = tPct >= 1 ? 'var(--accent)' : tPct >= 0.5 ? 'var(--partial)' : 'var(--fail)';
        html += `<td style="padding:6px 10px;text-align:center;font-weight:600;color:${tColor}">${total}/${maxTotal}</td></tr>`;
      });
      html += '</tbody></table></div></div>';
    });
    adminEl.innerHTML = html;
  } catch(e) {
    adminEl.innerHTML = '<p style="color:var(--fail)">제출 데이터를 불러올 수 없습니다. Sheets doGet에 admin 모드가 설정되어 있는지 확인하세요.</p>';
  }
}

/* 첫 로그인 시 학번_이름 등록 (중복 방지) */
async function doRegisterName(cb){
  const v = prompt('학번_이름 형식으로 입력하세요\n예) 202312345_홍길동');
  if (!v || !v.trim()) return;
  const newName = v.trim();
  // 중복 체크: 다른 계정이 같은 학번_이름을 이미 사용 중인지
  try {
    const existing = await db.collection('usernames').doc(newName).get();
    if (existing.exists && existing.data().uid !== firebaseUser.uid) {
      alert('이미 다른 계정에서 사용 중인 학번_이름입니다.\n본인의 학번_이름이 맞다면 교수님께 문의하세요.');
      return;
    }
  } catch(e){}
  const oldName = username;
  username = newName;
  localStorage.setItem(LS_USER, username);
  try {
    // users 컬렉션에 프로필 저장
    // 신규 문서일 때만 approved:false로 초기화 (기존 유저의 승인 상태는 보존)
    const userRef = db.collection('users').doc(firebaseUser.uid);
    const userDoc = await userRef.get();
    const payload = { username, email: firebaseUser.email, updatedAt: new Date().toISOString() };
    if (!userDoc.exists) payload.approved = false;
    await userRef.set(payload, { merge: true });
    // usernames 컬렉션에 역방향 매핑 저장 (중복 방지용)
    await db.collection('usernames').doc(newName).set({ uid: firebaseUser.uid, email: firebaseUser.email });
    // 이전 이름이 있었으면 삭제
    if (oldName && oldName !== newName) {
      await db.collection('usernames').doc(oldName).delete().catch(()=>{});
    }
  } catch(e){}
  if (cb) cb();
  else { history.replaceState({view:'home'}, '', ' '); renderHome(false); }
}
/* 기존 호환: doSetUser → 로그인 안 됐으면 로그인, 됐는데 이름 없으면 등록 */
function doSetUser(cb){
  if (!firebaseUser) { doLogin(); return; }
  if (!username) { doRegisterName(cb); return; }
  if (cb) cb();
}
function doChangeUser(){ doRegisterName(() => renderHome()); }

/* Firebase Auth 상태 감지 */
auth.onAuthStateChanged(async (user) => {
  firebaseUser = user;
  if (user) {
    // admin/TA는 자동 승인
    isApproved = isAdmin() || isTA();
    // Firestore에서 학번_이름 + 승인 상태 + 이력 한 번에 불러오기 (read 1회로 통합)
    let _mainDocData = null;
    try {
      const doc = await db.collection('users').doc(user.uid).get();
      if (doc.exists) _mainDocData = doc.data();
      if (_mainDocData && _mainDocData.approved === true) isApproved = true;
      if (_mainDocData && _mainDocData.username) {
        username = _mainDocData.username;
        localStorage.setItem(LS_USER, username);
      } else {
        // Firestore에 없으면 localStorage 값 확인
        const local = localStorage.getItem(LS_USER);
        if (local) {
          username = local;
          try { await db.collection('users').doc(user.uid).set({ username, email: user.email }, { merge: true }); } catch(e){}
        } else {
          username = '';
        }
      }
    } catch(e) {
      username = localStorage.getItem(LS_USER) || '';
    }
    // 마스코트 이미지 URL 프리로드 (실패해도 무시 — 토스트는 텍스트만 표시됨)
    if (!_mascotUrl) {
      storage.ref('mascot/mascot.jpg').getDownloadURL()
        .then(url => { _mascotUrl = url; })
        .catch(() => {});
    }
    // 이력 로드: 위에서 이미 가져온 메인 doc 데이터 재사용 (추가 read 0)
    await loadHistoryFromMainDoc(_mainDocData);
    // 관리자/TA면 비공개 drafts + 승인 대기 인원 로드
    await loadDrafts();
    await _loadPendingCount();
    // 관리자/TA면 수강생 진행 현황도 백그라운드 로드 (Sheets 기반, Firestore read ~55)
    if (isAdmin() || isTA()) {
      _loadClassProgress().then(res => {
        if (res && (view === 'home' || view === 'history')) {
          if (view === 'history') renderHistory(false);
          else renderHome(false);
        }
      });
    }
  } else {
    username = '';
    isApproved = false;
    historyCache = null;
    localStorage.removeItem(LS_USER);
    // 비로그인도 공개 drafts 로드 (loadDrafts 내부에서 splice로 기존 항목 정리함)
    await loadDrafts();
  }
  renderHome(false);
});

window.addEventListener('popstate', function(e){
  const s = e.state;
  if (!s || s.view === 'home') renderHome(false);
  else if (s.view === 'problem') renderProb(s.pid, false);
  else if (s.view === 'history') renderHistory(false);
  else if (s.view === 'admin') renderAdmin(false);
});
history.replaceState({view:'home'}, '', ' ');
// Apply saved theme
(function(){ const t=localStorage.getItem('oj_theme'); if(t==='dark') document.body.classList.add('dark'); })();
// 초기 렌더링은 onAuthStateChanged 콜백에서 수행
fetchSubmitCounts();
fetchRatings();
</script>

3. 기존 코드 삭제 후 아래 붙여넣기:

function doPost(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const d = JSON.parse(e.postData.contents);
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['시각','학번_이름','주차','문제ID','문제명','점수','만점','TC결과','코드','타입']);
  }
  sheet.appendRow([
    new Date(d.ts), d.username, d.week,
    d.problemId || '', d.problem,
    d.score !== null && d.score !== undefined ? d.score : '',
    d.max   !== null && d.max   !== undefined ? d.max   : '',
    d.tc || '',
    d.code || '',
    d.type || 'assignment'
  ]);
  return ContentService
    .createTextOutput(JSON.stringify({ ok: true }))
    .setMimeType(ContentService.MimeType.JSON);
}

function doGet(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const rows = sheet.getDataRange().getValues();
  const EXCLUDE = ['원경호', '황주옥'];
  const mode = (e && e.parameter && e.parameter.mode) || '';

  // 헤더에서 타입 컬럼 인덱스 찾기 (없으면 -1 → 기존 데이터는 assignment로 취급)
  const header = rows[0] || [];
  const typeCol = header.indexOf('타입');

  // 문제ID별 유니크 제출자 수
  const counts = {};
  const seenPid = new Set();
  // 학생별 유니크 제출 문제 수 (리더보드용)
  const userProbs = {};
  const seenUser = new Set();
  // 관리자 모드: 전체 제출 목록
  const submissions = [];

  for (let i = 1; i < rows.length; i++) {
    const user = String(rows[i][1] || '').trim();
    const pid  = String(rows[i][3] || '').trim();
    if (!user || !pid) continue;

    const isExcluded = EXCLUDE.some(name => user.includes(name));
    if (isExcluded) continue;

    const score = rows[i][5];
    const max   = rows[i][6];
    const ts    = rows[i][0] ? new Date(rows[i][0]).toLocaleString('ko-KR') : '';

    // 문제별 제출자 수
    const keyPid = user + '|' + pid;
    if (!seenPid.has(keyPid)) {
      seenPid.add(keyPid);
      counts[pid] = (counts[pid] || 0) + 1;
    }

    // 리더보드
    const keyUser = user + '|' + pid;
    if (!seenUser.has(keyUser)) {
      seenUser.add(keyUser);
      userProbs[user] = (userProbs[user] || 0) + 1;
    }

    // 관리자 모드: 제출 상세
    if (mode === 'admin') {
      submissions.push({ username: user, pid: pid, score: score, max: max, ts: ts });
    }
  }

  // 이름만 표시 (학번_이름 → 이름만)
  const leaderboard = Object.entries(userProbs)
    .map(([full, count]) => {
      const parts = full.split('_');
      const name = parts.length > 1 ? parts.slice(1).join('_') : full;
      return { name, count };
    })
    .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));

  const result = { counts, leaderboard };
  if (mode === 'admin') result.submissions = submissions;

  return ContentService
    .createTextOutput(JSON.stringify(result))
    .setMimeType(ContentService.MimeType.JSON);
}
