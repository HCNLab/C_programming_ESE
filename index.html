const JUDGE0  = 'https://ce.judge0.com';
const LANG_C  = 50;
const STARTER = '#define _CRT_SECURE_NO_WARNINGS\n#include <stdio.h>\n\nint main(void)\n{\n    \n    return 0;\n}\n';
const LS_USER = 'oj_username';
const LS_HIST = 'oj_history';

let view = 'home', curPid = null, curTab = 'prob';
let code = STARTER, tcResults = {}, submitting = false;
let username = localStorage.getItem(LS_USER) || '';

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function trim(s){ return (s || '').replace(/\r/g, '').trimEnd(); }
function $(id){ return document.getElementById(id); }
function isOpen(p){ return new Date() <= new Date(p.deadline); }

/* 이력 */
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(LS_HIST)||'{}'); }catch{ return {}; } }
function addHistory(pid, entry){
  const h = loadHistory();
  if (!h[pid]) h[pid] = [];
  h[pid].unshift(entry);
  if (h[pid].length > 20) h[pid] = h[pid].slice(0, 20);
  localStorage.setItem(LS_HIST, JSON.stringify(h));
}

/* Google Sheets */
function sendToSheets(payload){
  if (!SHEETS_URL) return;
  fetch(SHEETS_URL, { method:'POST', mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload) }).catch(()=>{});
}

/* Judge0 */
async function runCase(tc, src){
  try{
    const r = await fetch(`${JUDGE0}/submissions?base64_encoded=false&wait=false`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ source_code:src, language_id:LANG_C,
        stdin:tc.input, expected_output:tc.expected }),
    });
    const { token } = await r.json();
    if (!token) return { status:'fail', msg:'제출 실패' };
    for (let i = 0; i < 20; i++){
      await sleep(900);
      const d = await (await fetch(`${JUDGE0}/submissions/${token}?base64_encoded=false`)).json();
      if (d.status && d.status.id >= 3){
        const sid = d.status.id;
        const stdout = trim(d.stdout||''), exp = trim(tc.expected);
        if (sid === 3) return { status:'pass', stdout, expected:exp,
          time: d.time, memory: d.memory };
        if (sid === 6) return { status:'fail', msg:'컴파일 오류',
          detail: trim(d.compile_output||'').slice(0, 400) };
        if (sid === 5) return { status:'fail', msg:'시간 초과' };
        if (sid === 4) return { status:'fail', msg:'오답', stdout, expected:exp };
        return { status:'fail', msg: d.status.description,
          detail: trim(d.stderr||'').slice(0, 200) };
      }
    }
    return { status:'fail', msg:'채점 서버 응답 없음' };
  } catch { return { status:'fail', msg:'네트워크 오류' }; }
}

  if (username) return `<div class="user-chip">${username}
    <button class="link-btn" onclick="doChangeUser()">변경</button></div>
    <button onclick="renderHistory()">내 이력</button>`;
  return `<button onclick="doSetUser()">학번_이름 입력</button>`;
}

/* 홈 */
function renderHome(){
  view = 'home';
  const hist = loadHistory();
  // 주차별 그룹
  const groups = {};
  PROBLEMS.forEach(p => {
    const w = p.week;
    if (!groups[w]) groups[w] = [];
    groups[w].push(p);
  });
  const sectionsHtml = Object.keys(groups).map(w => {
    const cards = groups[w].map(p => {
      const open = isOpen(p);
      const entries = hist[p.id] || [];

      return `<div class="prob-card" onclick="goProb('${p.id}')">
        <div class="prob-card-title">${p.title}</div>
        <div class="prob-card-dl">마감 ${p.deadline}</div>
        <div class="prob-card-footer">
          <span class="open-badge ${open?'open':'closed'}">${open?'제출 가능':'마감'}</span>
          ${entries.length
            ? `<span style="font-size:11px;color:#0f6e56;margin-left:auto;font-weight:600">제출됨</span>`
            : `<span style="font-size:11px;color:#ccc;margin-left:auto">미제출</span>`}
        </div>
      </div>`;
    }).join('');
    return `<div class="week-section">
      <div class="week-label">${w}</div>
      <div class="card-grid">${cards}</div>
    </div>`;
  }).join('');

  $('app').innerHTML = `
    <div class="course-header">
      <div class="course-meta">임베디드시스템공학과 &nbsp;·&nbsp; 인천대학교</div>
      <div class="course-title">C언어프로그래밍(1)</div>
      <div class="course-code">0006799001</div>
      <div class="course-info">
        <span>Instructor: 원경호 교수</span>
        <span class="dot">·</span>
        <span>TA: 황주옥</span>
        <span class="dot">·</span>
        <a href="mailto:kyungho.won@inu.ac.kr">kyungho.won@inu.ac.kr</a>
      </div>
    </div>

    <div class="how-to">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem">
        <div class="how-title" style="margin-bottom:0">이용 방법</div>
        <div style="font-size:11px;color:#aaa">문제가 안 보이면 <code>Ctrl+Shift+R</code> (Mac: <code>Cmd+Shift+R</code>)</div>
      </div>
      <div class="how-steps">
        <div class="how-step"><span class="step-num">1</span><span>우측 상단 <b>학번_이름 입력</b> 클릭 &nbsp;→&nbsp; 예) <code>202312345_홍길동</code></span></div>
        <div class="how-step"><span class="step-num">2</span><span>문제 카드 클릭 후 <b>코드 작성</b> 탭에서 C 코드 작성</span></div>
        <div class="how-step"><span class="step-num">3</span><span><b>테스트 실행</b>으로 예제 케이스 확인 (서버 불안정 시 IDE에서 직접 확인)</span></div>
        <div class="how-step"><span class="step-num">4</span><span>완성 후 <b>제출 및 채점</b> 클릭 &nbsp;→&nbsp; 제출 완료 ✓ 확인</span></div>
        <div style="margin-top:.4rem;padding:.45rem .75rem;background:#fff8e1;border-radius:6px;font-size:12px;color:#888;border:1px solid #ffe082">
          ⚠ 제출 이력은 현재 PC/브라우저에만 저장됩니다. 다른 컴퓨터에서는 이력이 보이지 않으나, 제출 자체는 서버에 정상 기록됩니다.
        </div>
      </div>
    </div>

    <div class="topbar" style="margin-bottom:1rem">
      <div class="topbar-title" style="font-size:15px">과제 목록</div>
      ${userBar()}
    </div>
    ${sectionsHtml}`;
}

/* 문제 */
function renderProb(pid){
  view = 'problem'; curPid = pid; curTab = 'prob';
  const p = PROBLEMS.find(x => x.id === pid);
  code = STARTER; tcResults = {}; submitting = false;
  const hist = (loadHistory()[pid] || []);


  $('app').innerHTML = `
    <div class="topbar">
      <button class="back-btn" onclick="renderHome()">← 목록</button>
      <div class="topbar-title" style="font-size:15px">${p.week} — ${p.title}</div>
      ${userBar()}
    </div>
    ${hist.length ? `<div class="notice">제출 이력: <strong>${hist.length}회</strong>
      &nbsp;·&nbsp; 최근 ${new Date(hist[0].ts).toLocaleString('ko-KR')}
      &nbsp;·&nbsp; <span style="color:#378add;cursor:pointer" onclick="renderHistory()">이력 보기</span></div>` : ''}
    <div class="card" style="margin-bottom:1rem">
      <div class="section-lbl">문제</div>
      <div class="body-text">${p.desc}</div>
      <div class="section-lbl">입력</div>
      <div class="body-text">${p.input_desc}</div>
      <div class="section-lbl">출력</div>
      <div class="body-text">${p.output_desc}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <div><div class="section-lbl">예제 입력</div><div class="io-box">${p.ex_in}</div></div>
        <div><div class="section-lbl">예제 출력</div><div class="io-box">${p.ex_out}</div></div>
      </div>
    </div>
    <div class="section-lbl" style="margin-top:1.25rem;margin-bottom:.4rem">코드 작성</div>
    <textarea id="code-ta" spellcheck="false">${code}</textarea>
    <div class="btn-row">
      <button class="primary" id="sub-btn" onclick="doSubmit()">제출</button>
      <button id="test-btn" onclick="doTest()">테스트 실행</button>
      <button onclick="doReset()">초기화</button>
    </div>
    <div id="results"></div>`;

  /* Tab 인덴트 */
  const ta = $('code-ta');
  if (ta){
    ta.addEventListener('input', e => { code = e.target.value; });
    ta.addEventListener('keydown', function(e){
      if (e.key === 'Tab'){
        e.preventDefault();
        const s = this.selectionStart, end = this.selectionEnd;
        const spaces = '    ';
        this.value = this.value.substring(0, s) + spaces + this.value.substring(end);
        this.selectionStart = this.selectionEnd = s + spaces.length;
        code = this.value;
      }
    });
  }
}

function switchTab(t){
  curTab = t;
  $('prob-panel').style.display   = t === 'prob'   ? 'block' : 'none';
  $('editor-panel').style.display = t === 'editor' ? 'block' : 'none';
  $('tab-prob').className   = 'tab' + (t === 'prob'   ? ' active' : '');
  $('tab-editor').className = 'tab' + (t === 'editor' ? ' active' : '');
}

function renderResults(){
  const p = PROBLEMS.find(x => x.id === curPid);
  if (!p || !$('results')) return;
  let total = 0, max = 0;
  p.cases.forEach(tc => {
    max += tc.pts;
    if (tcResults[tc.id]?.status === 'pass') total += tc.pts;
  });
  const done = !submitting && Object.keys(tcResults).length > 0;

  const rows = p.cases.map(tc => {
    const r = tcResults[tc.id];
    let cls = '', badge = '', detail = '', perf = '';
    if (!r)
      badge = '<span class="badge wait">대기</span>';
    else if (r.status === 'running')
      { cls = ''; badge = '<span class="badge run">채점중</span>'; }
    else if (r.status === 'pass'){
      cls = 'tc-pass';
      badge = '<span class="badge pass">정답</span>';
      if (r.time || r.memory)
        perf = `<div class="tc-perf">${r.time ? r.time+'s' : ''}${r.time && r.memory ? ' · ' : ''}${r.memory ? r.memory+'KB' : ''}</div>`;
    } else {
      cls = 'tc-fail';
      badge = `<span class="badge fail">${r.msg || '오답'}</span>`;
      if (r.detail)
        detail = `<div class="tc-detail">${r.detail}</div>`;
      else if (r.stdout !== undefined)
        detail = `<div class="tc-detail">출력: <code>${r.stdout||'(없음)'}</code>&nbsp;&nbsp;기댓값: <code>${r.expected}</code></div>`;
    }
    return `<div class="tc-row ${cls}">
      ${badge}
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:#888">TC ${tc.id} &nbsp; ${tc.pts}점</div>
        ${detail}${perf}
      </div>
    </div>`;
  }).join('');

  $('results').innerHTML = `
    ${done ? `<div class="score-bar">
      <span style="font-size:19px;font-weight:600">${total} / ${max}점</span>
      ${total===max ? '<span style="font-size:13px;color:#0f6e56;margin-left:auto;font-weight:600">모두 정답!</span>' : ''}
    </div>` : ''}
    <div class="tc-list">${rows}</div>`;
}

/* 이력 */
function renderHistory(){
  view = 'history';
  const hist = loadHistory();
  const rows = PROBLEMS.map(p => {
    const entries = hist[p.id] || [];
    if (!entries.length) return `<tr>
      <td style="color:#aaa">${p.week}</td>
      <td>${p.title}</td>
      <td colspan="2" style="color:#ccc">미제출</td>
    </tr>`;
    return entries.map((e,i) => {
      const scoreCell = (e.score !== undefined && !isNaN(e.score))
        ? `<span style="color:#0f6e56;font-weight:600">${e.score}/${e.max}점</span>`
        : `<span style="color:#0f6e56;font-weight:600">제출됨</span>`;
      return `<tr>
        <td style="color:#aaa;font-size:12px">${i===0?p.week:''}</td>
        <td>${i===0?p.title:''}</td>
        <td>${scoreCell}</td>
        <td style="color:#aaa;font-size:12px">${new Date(e.ts).toLocaleString('ko-KR')}</td>
      </tr>`;
    }).join('');
  }).join('');

  $('app').innerHTML = `
    <div class="topbar">
      <button class="back-btn" onclick="renderHome()">← 목록</button>
      <div class="topbar-title" style="font-size:15px">내 제출 이력</div>
      ${userBar()}
    </div>
    <div class="notice" style="display:flex;align-items:center">
      <span>${username||'(이름 없음)'} · 브라우저 저장 (최대 20회/문제)</span>
      <button onclick="if(confirm('제출 이력을 모두 삭제할까요?')){localStorage.removeItem('oj_history');renderHistory();}" 
        style="margin-left:auto;font-size:11px;padding:2px 8px;color:#a32d2d;border-color:#f5c4b3">이력 초기화</button>
    </div>
    <div class="card" style="padding:0;overflow:hidden">
      <table style="width:100%;border-collapse:collapse">
        <thead><tr>
          <th style="padding:.5rem 1rem;text-align:left;font-size:12px;font-weight:600;color:#888;background:#f5f5f4;border-bottom:1px solid #e2e2e0;width:120px">주차</th>
          <th style="padding:.5rem 1rem;text-align:left;font-size:12px;font-weight:600;color:#888;background:#f5f5f4;border-bottom:1px solid #e2e2e0">문제</th>
          <th style="padding:.5rem 1rem;text-align:left;font-size:12px;font-weight:600;color:#888;background:#f5f5f4;border-bottom:1px solid #e2e2e0;width:110px">점수</th>
          <th style="padding:.5rem 1rem;text-align:left;font-size:12px;font-weight:600;color:#888;background:#f5f5f4;border-bottom:1px solid #e2e2e0">제출 시각</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

/* 액션 */
function goProb(pid){
  if (!username){ doSetUser(() => renderProb(pid)); return; }
  renderProb(pid);
}

async function doSubmit(){
  if (submitting) return;
  if (!username){ doSetUser(() => doSubmit()); return; }
  const p   = PROBLEMS.find(x => x.id === curPid);
  const src = $('code-ta')?.value || code;
  if (!src.trim() || src.trim() === STARTER.trim()){
    alert('코드를 작성한 후 제출하세요.'); return;
  }
  if (!confirm(`${p.title} 과제를 제출하시겠습니까?\n\n제출 후에도 재제출이 가능합니다.`)) return;

  submitting = true;
  const btn = $('sub-btn');
  if (btn){ btn.disabled = true; btn.textContent = '제출 중...'; }

  const ts = new Date().toISOString();
  addHistory(p.id, { ts, submitted: true });
  sendToSheets({ ts, username, week: p.week, problemId: p.id,
    problem: p.title, code: src });

  submitting = false;
  if (btn){ btn.disabled = false; btn.textContent = '제출'; }

  // 결과 영역에 제출 완료 표시
  if ($('results')){
    $('results').innerHTML = `<div style="padding:.85rem 1rem;background:#e1f5ee;border:1px solid #1D9E75;
      border-radius:8px;color:#0f6e56;font-size:14px;font-weight:600">
      제출 완료 ✓ &nbsp;<span style="font-weight:400;font-size:12px">${new Date(ts).toLocaleString('ko-KR')}</span>
    </div>`;
  }
}

async function doTest(){
  if (submitting) return;
  const p   = PROBLEMS.find(x => x.id === curPid);
  const src = $('code-ta')?.value || code;
  const tc  = p.cases[0];
  submitting = true;
  const testBtn = $('test-btn');
  if (testBtn){ testBtn.disabled = true; testBtn.textContent = '실행 중...'; }
  tcResults = { [tc.id]: { status:'running' } };
  renderResults();
  tcResults[tc.id] = await runCase(tc, src);
  // Judge0 실패 시 안내 메시지로 교체
  if (tcResults[tc.id].status === 'fail' &&
      (tcResults[tc.id].msg === '네트워크 오류' || tcResults[tc.id].msg === '채점 서버 응답 없음')) {
    tcResults[tc.id] = { status:'fail', msg:'채점 서버 오류', detail:'IDE에서 실행 확인 후 제출 버튼을 눌러 주세요.' };
  }
  renderResults();
  submitting = false;
  if (testBtn){ testBtn.disabled = false; testBtn.textContent = '테스트 실행'; }
}

function doReset(){
  code = STARTER;
  const el = $('code-ta');
  if (el) el.value = code;
  tcResults = {};
  renderResults();
}

function doSetUser(cb){
  const v = prompt('학번_이름 형식으로 입력하세요\n예) 202312345_홍길동');
  if (v && v.trim()){
    username = v.trim();
    localStorage.setItem(LS_USER, username);
    if (cb) cb(); else renderHome();
  }
}
function doChangeUser(){ doSetUser(() => renderHome()); }

renderHome();
</script>

  Google Sheets 연동 설정
================================================================
1. Google Sheets 새 파일 생성
2. 확장 프로그램 → Apps Script 열기
3. 기존 코드 삭제 후 아래 붙여넣기:

function doPost(e) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  const d = JSON.parse(e.postData.contents);
  // 헤더 없으면 첫 행에 추가
  if (sheet.getLastRow() === 0) {
    sheet.appendRow(['시각','학번_이름','주차','문제ID','문제명','코드']);
  }
  sheet.appendRow([
    new Date(d.ts), d.username, d.week,
    d.problemId || '', d.problem, d.code || ''
  ]);
  return ContentService
    .createTextOutput(JSON.stringify({ ok: true }))
    .setMimeType(ContentService.MimeType.JSON);
}

4. 배포 → 새 배포 → 웹 앱
   실행: 나 / 액세스: 모든 사용자
   → URL 복사

5. 이 파일 상단 SHEETS_URL = '복사한 URL' 수정
