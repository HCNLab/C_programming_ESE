<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C Programming (1) — INU</title>
<style>
:root{
  --bg:#f5f5f4;--surface:#fff;--surface2:#fafaf9;--surface3:#f5f5f4;--surface4:#f0f0ee;
  --border:#e2e2e0;--border2:#d4d4d0;
  --text:#1a1a1a;--text2:#555;--text3:#888;--text4:#aaa;--text5:#ccc;--text6:#333;--text7:#444;--text8:#bbb;
  --accent:#1D9E75;--accent-bg:#e1f5ee;--accent-text:#0f6e56;
  --fail:#935f4e;--fail-bg:#faece7;
  --pass-badge-bg:#9fe1cb;--pass-badge-tx:#085041;
  --fail-badge-bg:#f5c4b3;--fail-badge-tx:#4a1b0c;
  --run-badge-bg:#b5d4f4;--run-badge-tx:#042c53;
  --warn-bg:#fff8e1;--warn-border:#ffe082;--warn-text:#5a4a00;
  --error:#a32d2d;--partial:#b07d1a;--link:#378add;
  --incomplete:#e8e8e6;--shadow:rgba(0,0,0,.06);--overlay:rgba(0,0,0,.45);
}
body.dark{
  --bg:#111;--surface:#1e1e1e;--surface2:#181818;--surface3:#252525;--surface4:#2a2a2a;
  --border:#333;--border2:#444;
  --text:#e8e8e6;--text2:#9a9a98;--text3:#777;--text4:#666;--text5:#444;--text6:#ccc;--text7:#aaa;--text8:#555;
  --accent:#1D9E75;--accent-bg:#0a2e22;--accent-text:#1D9E75;
  --fail:#e06040;--fail-bg:#2a1510;
  --pass-badge-bg:#0a3028;--pass-badge-tx:#9fe1cb;
  --fail-badge-bg:#5a2010;--fail-badge-tx:#f5c4b3;
  --run-badge-bg:#0a2040;--run-badge-tx:#b5d4f4;
  --warn-bg:#2a2510;--warn-border:#5a4a10;--warn-text:#c8a020;
  --error:#e05555;--partial:#d4a035;--link:#5a9fd4;
  --incomplete:#333;--shadow:rgba(0,0,0,.3);--overlay:rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh;transition:background .2s,color .2s}
.wrap{max-width:1440px;margin:0 auto;padding:1.5rem 1rem}
.user-chip{font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.link-btn{background:none;border:none;font-size:12px;color:var(--text3);cursor:pointer;padding:0}
.link-btn:hover{color:var(--text6)}
button{padding:.45rem 1rem;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
button:hover{background:var(--surface4)}
button:active{transform:scale(.98)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--text);color:var(--surface);border-color:transparent}
button.primary:hover{background:var(--text6)}
.back-btn{background:none;border:none;font-size:13px;color:var(--text3);cursor:pointer;padding:0}
.back-btn:hover{color:var(--text6)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem}
.week-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.6rem}
.prob-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.prob-card:hover{border-color:var(--text4);box-shadow:0 2px 8px var(--shadow)}
.prob-card-title{font-size:14px;font-weight:600;margin-bottom:.3rem;color:var(--text)}
.prob-card-dl{font-size:11px;color:var(--text3)}
.prob-card-footer{display:flex;align-items:center;margin-top:8px;padding-top:7px;border-top:1px solid var(--surface4)}
.open-badge{font-size:11px;padding:2px 6px;border-radius:3px;font-weight:600}
.open-badge.open{background:var(--accent-bg);color:var(--accent-text)}
.open-badge.closed{background:var(--surface4);color:var(--text2)}
.section-lbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem;margin-top:.85rem}
.section-lbl:first-child{margin-top:0}
.body-text{font-size:14px;line-height:1.7;color:var(--text)}
.prob-pane{-webkit-user-select:none;user-select:none}
.io-box{font-family:'Menlo','Consolas',monospace;font-size:13px;padding:.55rem .8rem;background:var(--surface3);border:1px solid var(--border);border-radius:8px;white-space:pre-wrap;word-break:break-word;color:var(--text)}
textarea{width:100%;min-height:200px;font-family:'Menlo','Consolas',monospace;font-size:13px;padding:.75rem;border:1px solid var(--border2);border-radius:8px;background:var(--surface);color:var(--text);resize:vertical;outline:none;line-height:1.6;margin-bottom:.75rem}
textarea:focus{border-color:var(--text3)}
.btn-row{display:flex;gap:8px;margin-bottom:1rem}
.score-bar{display:flex;align-items:center;gap:10px;padding:.7rem 1rem;background:var(--surface3);border:1px solid var(--border);border-radius:8px;margin-bottom:.75rem;color:var(--text)}
.tc-list{display:flex;flex-direction:column;gap:6px}
.tc-row{display:flex;align-items:flex-start;gap:10px;padding:.55rem .85rem;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.tc-row.tc-pass{border-color:var(--accent);background:var(--accent-bg)}
.tc-row.tc-fail{border-color:var(--fail);background:var(--fail-bg)}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px;min-width:50px;text-align:center;white-space:nowrap;flex-shrink:0;margin-top:2px}
.badge.pass{background:var(--pass-badge-bg);color:var(--pass-badge-tx)}
.badge.fail{background:var(--fail-badge-bg);color:var(--fail-badge-tx)}
.badge.wait{background:var(--surface4);color:var(--text3);border:1px solid var(--border)}
.badge.run{background:var(--run-badge-bg);color:var(--run-badge-tx)}
.tc-detail{font-size:12px;font-family:'Menlo',monospace;color:var(--text3);margin-top:2px}
.tc-perf{font-size:11px;color:var(--text4);font-family:'Menlo',monospace;margin-top:1px}
.tab{padding:.4rem .9rem;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:13px;background:var(--surface);color:var(--text3)}
.tab.active{background:var(--text);color:var(--surface);border-color:transparent}
.course-header{background:var(--surface);border:none;border-bottom:3px solid var(--text);border-radius:0;padding:1.5rem 1.75rem;margin-bottom:1rem;position:relative}
.header-hourly{position:absolute;right:16px;bottom:12px;width:240px;display:flex;flex-direction:column;align-items:stretch;gap:3px}
.header-hourly-label{font-size:10px;color:var(--text3);text-align:right;letter-spacing:.02em}
.header-hourly-plot{position:relative;display:flex;align-items:stretch;height:60px}
.header-hourly-yaxis{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;padding-right:3px;padding-bottom:11px;font-size:8px;color:var(--text5);line-height:1;min-width:12px}
.header-hourly-bars{flex:1;display:flex;align-items:flex-end;gap:1px;padding-bottom:11px;position:relative;border-left:1px solid var(--surface4)}
.header-hourly-gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--surface4);pointer-events:none}
@media(max-width:720px){.header-hourly{display:none}}
.course-meta{font-size:12px;color:var(--text3);margin-bottom:.5rem;letter-spacing:.02em}
.course-title{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:.2rem;line-height:1.2;color:var(--text)}
.course-code{font-size:13px;color:var(--text4);font-family:'Menlo','Consolas',monospace;margin-bottom:.75rem}
.course-info{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--text2)}
.course-info a{color:var(--link);text-decoration:none}
.dot{color:var(--text5)}
.how-to{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1.25rem}
.how-title{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.65rem}
.how-steps{display:flex;flex-direction:column;gap:.45rem}
.how-step{display:flex;align-items:baseline;gap:.6rem;font-size:13px;color:var(--text7);line-height:1.55}
.step-num{background:var(--text);color:var(--surface);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.layout{display:grid;grid-template-columns:1fr;gap:1.25rem}
@media(min-width:960px){.layout{grid-template-columns:1fr 300px}}
@media(max-width:959px){.sidebar{order:-1}}
.prob-layout{display:flex;flex-direction:column;gap:1rem}
@media(min-width:960px){.prob-layout{flex-direction:row}.prob-layout>.prob-pane{order:2;flex:0 0 45%;min-width:0;max-height:calc(100vh - 120px);overflow-y:auto;position:sticky;top:80px;transition:flex-basis .25s}.prob-layout>.code-pane{order:1;flex:0 0 55%;min-width:0;transition:flex-basis .25s}.prob-layout.prob-wide>.prob-pane{flex-basis:60%}.prob-layout.prob-wide>.code-pane{flex-basis:40%}.prob-layout.prob-full>.prob-pane{flex-basis:100%}.prob-layout.prob-full>.code-pane{display:none}}
.prob-resize{display:none}
@media(min-width:960px){.prob-resize{display:inline-flex;gap:2px;margin-left:auto}.prob-resize button{padding:2px 7px;font-size:11px;border-radius:5px;min-width:0}}
.sidebar{display:flex;flex-direction:column;gap:.85rem}
.sidebar-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.9rem 1rem}
.sidebar-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:.7rem;letter-spacing:-.2px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem}
.topbar-title{font-size:17px;font-weight:600;flex:1;color:var(--text)}
.view-toggle{display:flex;gap:4px;margin-left:auto}
.view-btn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--text3)}
.view-btn.active{background:var(--text);color:var(--surface);border-color:transparent}
.wf-btn{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text3);cursor:pointer}
.wf-btn.active{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.week-section{margin-bottom:1.5rem}
.new-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;color:#fff;background:#D85A30;border-radius:3px;padding:1px 4px;margin-left:4px;vertical-align:middle;animation:newPulse 1.6s ease-in-out infinite}
.draft-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;color:#000;background:#FFD93D;border:1px solid #C9A600;border-radius:3px;padding:1px 4px;margin-left:4px;vertical-align:middle}
.draft-card{outline:2px dashed #C9A600;outline-offset:-2px;background:linear-gradient(135deg,var(--surface) 0%,var(--surface) 60%,rgba(255,217,61,.08) 100%)!important}
@keyframes newPulse{0%,100%{box-shadow:0 0 0 0 rgba(216,90,48,.55)}50%{box-shadow:0 0 0 4px rgba(216,90,48,0)}}
.list-view .card-grid{display:flex;flex-direction:column;gap:.4rem}
.list-view .prob-card{display:flex;align-items:center;gap:12px;padding:.65rem 1rem;border-radius:8px}
.list-view .prob-card-title{margin-bottom:0;font-size:13px}
.list-view .prob-card-dl{font-size:11px;color:var(--text4);white-space:nowrap}
.list-view .prob-card-footer{margin-top:0;padding-top:0;border-top:none;margin-left:auto;flex-shrink:0}
.notice{font-size:12px;color:var(--text3);background:var(--surface3);border-left:3px solid var(--border2);padding:.55rem .8rem;border-radius:0 6px 6px 0;margin-bottom:1rem}
/* Post-it style professor comment */
.prof-note{
  position:relative;
  margin:1.4rem .6rem .6rem .3rem;
  background:linear-gradient(135deg,#fff7a8 0%,#ffe97a 100%);
  color:#3a2f00;
  border:none;
  border-radius:2px 14px 3px 2px;
  box-shadow:
    2px 3px 6px rgba(0,0,0,.14),
    0 1px 2px rgba(0,0,0,.08),
    inset 0 -20px 30px -20px rgba(180,140,0,.18);
  transform:rotate(-.45deg);
  transition:transform .18s ease, box-shadow .18s ease;
}
.prof-note:hover{transform:rotate(-.15deg) translateY(-1px);box-shadow:3px 5px 12px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.08),inset 0 -20px 30px -20px rgba(180,140,0,.18)}
.prof-note::before{
  content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:52px;height:14px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(220,220,220,.35));
  border:1px solid rgba(140,120,60,.18);
  border-radius:1px;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
}
.prof-note>summary{cursor:pointer;user-select:none;list-style:none;padding:.9rem 1rem .55rem 1rem;font-size:13.5px;font-weight:700;color:#4a3800;display:flex;align-items:center;gap:7px;font-family:'Segoe Print','Comic Sans MS',-apple-system,sans-serif;letter-spacing:.2px}
.prof-note>summary::-webkit-details-marker{display:none}
.prof-note>summary::after{content:'▸';font-size:11px;margin-left:auto;color:#806000;transition:transform .2s}
.prof-note[open]>summary::after{transform:rotate(90deg)}
.prof-note-hint{font-size:11px;font-weight:400;font-style:italic;color:#8a6d00;margin-left:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.prof-note[open]>summary .prof-note-hint{display:none}
body.dark .prof-note-hint{color:#c8a040}
.prof-note-body{padding:.15rem 1rem 1rem 1rem;font-size:13.5px;color:#3a2f00;white-space:pre-wrap;line-height:1.65;font-family:'Segoe Print','Comic Sans MS',-apple-system,sans-serif}
.prof-note-empty{color:#8a7520;font-style:italic}
.prof-note-actions{display:flex;gap:6px;padding:0 1rem .9rem 1rem}
.prof-note-actions button{font-size:11px;padding:4px 11px;border-radius:4px;border:1px solid rgba(100,80,0,.35);background:rgba(255,255,255,.55);color:#4a3800;cursor:pointer;font-weight:600}
.prof-note-actions button:hover{background:rgba(255,255,255,.85)}
.prof-note-actions button.primary{background:#c89020;border-color:#a06800;color:#fff}
.prof-note-actions button.primary:hover{background:#b07810}
.prof-note-actions button.danger{color:#a32d2d;border-color:rgba(163,45,45,.45)}
.prof-note textarea{width:100%;box-sizing:border-box;min-height:90px;font:13.5px/1.55 'Segoe Print','Comic Sans MS',-apple-system,sans-serif;padding:.6rem .75rem;border:1px dashed rgba(100,80,0,.4);border-radius:3px;background:rgba(255,255,255,.55);color:#3a2f00;resize:vertical;margin-bottom:.4rem}
.prof-note textarea:focus{outline:none;background:rgba(255,255,255,.85);border-color:rgba(100,80,0,.7)}
body.dark .prof-note{
  background:linear-gradient(135deg,#4a3d0a 0%,#3a2f05 100%);
  color:#ffe580;
  box-shadow:2px 3px 8px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3),inset 0 -20px 30px -20px rgba(0,0,0,.35);
}
body.dark .prof-note>summary{color:#ffe580}
body.dark .prof-note>summary::after{color:#c8a040}
body.dark .prof-note-body{color:#ffe580}
body.dark .prof-note-empty{color:#8a7530}
body.dark .prof-note::before{background:linear-gradient(180deg,rgba(200,200,200,.2),rgba(120,120,120,.15));border-color:rgba(200,180,100,.2)}
body.dark .prof-note-actions button{background:rgba(0,0,0,.25);color:#ffe580;border-color:rgba(200,180,100,.35)}
body.dark .prof-note-actions button:hover{background:rgba(0,0,0,.45)}
body.dark .prof-note-actions button.primary{background:#a07820;border-color:#c89040;color:#fff}
body.dark .prof-note textarea{background:rgba(0,0,0,.3);color:#ffe580;border-color:rgba(200,180,100,.4)}
body.dark .prof-note textarea:focus{background:rgba(0,0,0,.5)}
code{font-family:'Menlo','Consolas',monospace;background:var(--surface4);padding:1px 4px;border-radius:3px;font-size:12px;color:var(--text)}
.mobile-user-bar{display:none}
.how-to-user{flex-shrink:0;width:190px;padding-left:1rem;display:flex;flex-direction:column;align-items:stretch;justify-content:center}
.how-to-user.staff{width:300px}
.user-card-deco{position:relative;padding:.95rem .85rem;border-radius:14px;border:1.5px solid transparent;
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(135deg,rgba(59,130,246,.75),rgba(139,92,246,.65),rgba(216,90,48,.7)) border-box;
  box-shadow:0 3px 14px rgba(59,130,246,.08),0 1px 3px rgba(0,0,0,.04);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  transition:box-shadow .3s,transform .3s}
.user-card-deco:hover{box-shadow:0 5px 20px rgba(59,130,246,.14),0 2px 6px rgba(0,0,0,.06);transform:translateY(-1px)}
.user-card-deco.staff{
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(135deg,#D85A30,#FFD93D,#D85A30) border-box;
  box-shadow:0 3px 14px rgba(216,90,48,.12),0 1px 3px rgba(0,0,0,.04)}
.user-card-deco.pending{
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(135deg,#C9A600,#FFD93D,#C9A600) border-box;
  box-shadow:0 3px 14px rgba(201,166,0,.15),0 1px 3px rgba(0,0,0,.04)}
.user-card-deco.guest{
  background:linear-gradient(var(--surface),var(--surface)) padding-box,
             linear-gradient(135deg,var(--border2),var(--border),var(--border2)) border-box;
  box-shadow:0 2px 8px rgba(0,0,0,.04)}
body.dark .user-card-deco{box-shadow:0 3px 14px rgba(139,92,246,.15),0 1px 3px rgba(0,0,0,.3)}
body.dark .user-card-deco.staff{box-shadow:0 3px 14px rgba(255,217,61,.12),0 1px 3px rgba(0,0,0,.3)}
/* 🎉 All-problems-complete celebration effect */
.confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:99998;overflow:hidden}
.confetti-piece{position:absolute;top:-24px;width:10px;height:14px;border-radius:2px;opacity:.95;
  animation:confettiFall linear forwards}
@keyframes confettiFall{
  0%{transform:translate3d(0,-24px,0) rotate(0deg)}
  100%{transform:translate3d(var(--dx,0),105vh,0) rotate(var(--rot,720deg))}
}
.celebrate-banner{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%) scale(.3);
  background:linear-gradient(135deg,#D85A30 0%,#FFD93D 50%,#5B8C3E 100%);
  color:#fff;padding:1.4rem 2.6rem;border-radius:22px;font-size:28px;font-weight:800;
  text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.25);letter-spacing:-.02em;
  box-shadow:0 24px 70px rgba(0,0,0,.35),0 0 0 4px rgba(255,255,255,.5) inset;
  z-index:99999;pointer-events:none;opacity:0;animation:bannerPop .6s cubic-bezier(.2,1.6,.4,1) forwards,
  bannerGlow 2.2s ease-in-out .6s infinite}
@keyframes bannerPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}
  60%{opacity:1;transform:translate(-50%,-50%) scale(1.08) rotate(2deg)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
}
@keyframes bannerGlow{
  0%,100%{filter:drop-shadow(0 0 8px rgba(255,217,61,.5))}
  50%{filter:drop-shadow(0 0 18px rgba(255,217,61,.85))}
}

/* Mascot encouragement toast (bottom right) */
.mascot-toast{position:fixed;right:24px;bottom:24px;z-index:99997;
  display:flex;align-items:flex-end;gap:8px;pointer-events:none;
  transform:translateY(140%);opacity:0;
  transition:transform .55s cubic-bezier(.2,.9,.25,1.15),opacity .35s}
.mascot-toast.show{transform:translateY(0);opacity:1}
.mascot-toast img{width:130px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.22))}
.mascot-toast .bubble{position:relative;margin-bottom:38px;
  background:#fff;border:2px solid #1f2937;border-radius:14px;
  padding:.6rem .95rem;font-size:13px;font-weight:700;color:#1f2937;
  box-shadow:0 6px 18px rgba(0,0,0,.14);max-width:200px;line-height:1.35}
.mascot-toast .bubble::after{content:'';position:absolute;right:-11px;bottom:14px;
  width:0;height:0;border:9px solid transparent;border-left-color:#1f2937}
.mascot-toast .bubble::before{content:'';position:absolute;right:-7px;bottom:16px;
  width:0;height:0;border:7px solid transparent;border-left-color:#fff;z-index:1}
body.dark .mascot-toast .bubble{background:#1e293b;border-color:#cbd5e1;color:#f1f5f9}
body.dark .mascot-toast .bubble::after{border-left-color:#cbd5e1}
body.dark .mascot-toast .bubble::before{border-left-color:#1e293b}

/* Submission history */
/* History: Firestore primary, fallback to localStorage */
let historyCache = null;  // in-memory cache

function loadHistory(){
  if (historyCache) return historyCache;
  try{ return JSON.parse(localStorage.getItem(LS_HIST)||'{}'); }catch{ return {}; }
}

// cap for cloud: latest 5 per pid (against 1MB Firestore doc limit)
function _capHistoryForCloud(h){
  const out = {};
  for (const pid in h) out[pid] = (h[pid] || []).slice(0, 5);
  return out;
}

function addHistory(pid, entry){
  const h = loadHistory();
  if (!h[pid]) h[pid] = [];
  h[pid].unshift(entry);
  if (h[pid].length > 20) h[pid] = h[pid].slice(0, 20);
  localStorage.setItem(LS_HIST, JSON.stringify(h));
  historyCache = h;
  // async save to Firestore: update users/{uid}.history.{pid} (0 extra reads)
  if (firebaseUser) {
    const capped = h[pid].slice(0, 5);
    db.collection('users').doc(firebaseUser.uid)
      .update({ [`history.${pid}`]: capped })
      .catch(() => {
        // create with merge if doc does not exist yet
        db.collection('users').doc(firebaseUser.uid)
          .set({ history: { [pid]: capped } }, { merge: true })
          .catch(() => {});
      });
  }
}

// main doc already read in onAuthStateChanged — extract history field from it
// legacy structure (users/{uid}/history subcollection) migrated to main doc field (one-time)
async function loadHistoryFromMainDoc(mainDocData){
  if (!firebaseUser) { historyCache = null; return; }
  try {
    const d = mainDocData || {};
    let localH = {};
    try { localH = JSON.parse(localStorage.getItem(LS_HIST) || '{}'); } catch(e){}

    if (d.history && typeof d.history === 'object') {
      // new structure: use history field from main doc (merged with latest localStorage entries)
      const merged = { ...d.history };
      for (const pid in localH) {
        const lTs = localH[pid] && localH[pid][0] && localH[pid][0].ts;
        const cTs = merged[pid] && merged[pid][0] && merged[pid][0].ts;
        if (!merged[pid] || (lTs && (!cTs || lTs > cTs))) merged[pid] = localH[pid];
      }
      historyCache = merged;
      localStorage.setItem(LS_HIST, JSON.stringify(historyCache));
      return;
    }

    // migration: legacy subcollection -> main doc field (once per user)
    const snap = await db.collection('users').doc(firebaseUser.uid)
      .collection('history').get();
    const cloudH = {};
    snap.forEach(doc => { cloudH[doc.id] = doc.data().entries || []; });
    const source = Object.keys(cloudH).length > 0 ? cloudH
                  : (Object.keys(localH).length > 0 ? localH : {});

    historyCache = source;
    if (Object.keys(source).length > 0) {
      localStorage.setItem(LS_HIST, JSON.stringify(source));
      await db.collection('users').doc(firebaseUser.uid)
        .set({ history: _capHistoryForCloud(source) }, { merge: true })
        .catch(() => {});
    }
  } catch(e) {
    historyCache = null;
  }
}

/* Judge0 */
async function callWandbox(src, input){
  const r = await fetch(WANDBOX, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      compiler: 'gcc-head',
      code: src,
      stdin: input,
      options: 'warning',
      compiler_option_raw: '-lm',
    }),
  });
  if (!r.ok) return null;
  return r.json();
}

async function runCase(tc, src){
  try{
    let d = await callWandbox(src, tc.input);
    if (!d) return { status:'fail', msg:'채점 서버 오류' };
    // server overload errors (OCI runtime etc.) — retry instead of showing compile error
    let serverBusy = false;
    if (d.compiler_error && (
      d.compiler_error.includes('OCI runtime') ||
      d.compiler_error.includes('Resource temporarily unavailable') ||
      d.compiler_error.includes('crun:')
    )) {
      serverBusy = true;
      await new Promise(res => setTimeout(res, 1500 + Math.random()*1500));
      const d2 = await callWandbox(src, tc.input);
      if (d2) d = d2;
    }
    const hasError = d.compiler_error && d.compiler_error.includes('error:') &&
      !d.compiler_error.includes('OCI runtime') &&
      !d.compiler_error.includes('crun:');
    if (hasError){
      return { status:'fail', msg:'컴파일 오류',
        detail: d.compiler_error.trim().slice(0, 400) };
    }
    // detect timeout / runtime errors
    if (d.signal) {
      const isTimeout = d.signal === 'Killed' || d.signal === 'Timeout';
      return { status:'fail',
        msg: isTimeout ? '시간 초과' : '런타임 오류',
        detail: isTimeout ? '무한루프 또는 실행 시간 초과' : `Signal: ${d.signal}`,
        stdout: trim(d.program_output || ''), expected: trim(tc.expected), input: tc.input };
    }
    const stdout = trim(d.program_output || '');
    const exp    = trim(tc.expected);
    if (stdout === exp){
      return { status:'pass', stdout, expected:exp, input:tc.input };
    } else {
      const msg = (serverBusy && stdout === '') ? '서버 혼잡 — 잠시 후 재시도' : '오답';
      return { status:'fail', msg, stdout, expected:exp, input:tc.input };
    }
  } catch { return { status:'fail', msg:'네트워크 오류' }; }
}

/* ── Firestore Drafts (private/published problems) ── */
// private (draft): Firestore drafts/{pid}, no published field -> staff only
// published: drafts/{pid} + published:true -> visible to all logged-in users
// merged into PROBLEMS array alongside hardcoded problems in git
async function loadDrafts(){
  // remove existing Firestore entries to prevent duplicates
  for (let i = PROBLEMS.length - 1; i >= 0; i--) {
    if (PROBLEMS[i]._isDraft || PROBLEMS[i]._isPublished) PROBLEMS.splice(i, 1);
  }
  try {
    if (isAdmin() || isTA()) {
      // staff: load all drafts (private + published)
      const snap = await db.collection('drafts').get();
      snap.forEach(doc => {
        const d = doc.data();
        d.id = doc.id;
        if (d.published) {
          d._isPublished = true;
        } else {
          d._isDraft = true;
        }
        PROBLEMS.push(d);
      });
      console.log(`[drafts] loaded ${snap.size} (staff)`);
    } else {
      // students and guests: load published only
      const snap = await db.collection('drafts').where('published', '==', true).get();
      snap.forEach(doc => {
        const d = doc.data();
        d.id = doc.id;
        d._isPublished = true;
        PROBLEMS.push(d);
      });
      if (snap.size > 0) console.log(`[drafts] loaded ${snap.size} published`);
    }
  } catch (e) {
    console.warn('[drafts] load failed:', e.message);
  }
}

window._publishBulkToggle = function(on){
  const overlay = document.getElementById('publish-overlay');
  if (!overlay) return;
  overlay.querySelectorAll('input[data-pid]').forEach(chk => {
    if (chk.checked !== on) {
      chk.checked = on;
      chk.dispatchEvent(new Event('change'));
    }
  });
};

window._applyPublishChanges = async function(){
  const overlay = document.getElementById('publish-overlay');
  if (!overlay) return;
  const btn = document.getElementById('publish-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }
  const checks = overlay.querySelectorAll('input[data-pid]');
  // fetch current DB state (check createdAt and existing published flag)
  const snap = await db.collection('drafts').get();
  const current = {};
  snap.forEach(doc => { current[doc.id] = doc.data(); });
  const batch = db.batch();
  const nowIso = new Date().toISOString();
  let changed = 0;
  checks.forEach(chk => {
    const pid = chk.dataset.pid;
    const shouldPublish = chk.checked;
    const cur = current[pid] || {};
    const update = { published: shouldPublish || false };
    // stamp createdAt on first publish so NEW badge shows
    if (shouldPublish && !cur.createdAt) update.createdAt = nowIso;
    batch.update(db.collection('drafts').doc(pid), update);
    changed++;
  });
  await batch.commit();
  overlay.remove();
  await loadDrafts();
  if (typeof renderHome === 'function' && view === 'home') renderHome(false);
  alert(`${changed}개 문제 상태 저장 완료`);
};

/* Download all drafts as PROBLEMS array code (.txt) */
window._downloadDraftsCode = async function(){
  if (!isAdmin() && !isTA()) { alert('권한 없음'); return; }
  const snap = await db.collection('drafts').get();
  if (snap.empty) { alert('drafts 비어있음'); return; }
  const arr = [];
  snap.forEach(doc => {
    const d = { id: doc.id, ...doc.data() };
    delete d._isDraft;
    arr.push(d);
  });
  arr.sort((a, b) => {
    const w = (a.week || '').localeCompare(b.week || '');
    return w !== 0 ? w : a.id.localeCompare(b.id);
  });
  let body = '';
  let curWeek = null;
  for (const p of arr) {
    if (p.week !== curWeek) {
      curWeek = p.week;
      body += `\n  /* ── ${curWeek} ────────────────── */\n`;
    }
    body += '  ' + JSON.stringify(p, null, 2).replace(/\n/g, '\n  ') + ',\n';
  }
  const header = `// ${arr.length} problem(s) -- paste inside the "const PROBLEMS = [" array in index.html and git push\n`;
  const blob = new Blob([header + body], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `publish_drafts_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
  URL.revokeObjectURL(url);
};

window._deleteAllDrafts = async function(){
  if (!isAdmin() && !isTA()) { alert('권한 없음'); return; }
  const snap = await db.collection('drafts').get();
  if (snap.empty) { alert('이미 비어있음'); return; }

  const batch = db.batch();
  snap.forEach(doc => batch.delete(doc.ref));
  await batch.commit();
  await loadDrafts();
  if (typeof renderHome === 'function' && view === 'home') renderHome(false);
  alert(`${snap.size}개 삭제 완료`);
};

/* Batch upload from JSON file — called by the admin/TA "upload private problems" button */
window._uploadDrafts = async function(file){
  if (!file) return;
  if (!isAdmin() && !isTA()) { alert('권한 없음'); return; }
  try {
    const text = await file.text();
    const arr = JSON.parse(text);
    if (!Array.isArray(arr)) throw new Error('JSON 최상위가 배열이어야 합니다');
    if (!confirm(`${arr.length}개 문제를 비공개로 업로드합니다. 진행할까요?`)) return;
    let ok = 0, fail = 0;
    for (const p of arr) {
      if (!p.id) { fail++; continue; }
      const data = { ...p };
      delete data.id;
      try {
        await db.collection('drafts').doc(p.id).set(data);
        ok++;
      } catch (e) {
        console.error(p.id, e);
        fail++;
      }
    }
    await loadDrafts();
    if (typeof renderHome === 'function' && view === 'home') renderHome(false);
    alert(`업로드 완료: 성공 ${ok}개, 실패 ${fail}개`);
  } catch (e) {
    alert('업로드 실패: ' + e.message);

/* publishAllDrafts(): output all drafts as PROBLEMS array code at once
   - paste the clipboard text into the PROBLEMS array in index.html
   - then commit & push -> after all published, call removeAllDrafts()
   - sorted by week / id
*/
window.publishAllDrafts = async function(){
  if (!isAdmin() && !isTA()) { console.error('관리자만 사용 가능'); return; }
  const snap = await db.collection('drafts').get();
  if (snap.empty) { console.warn('[drafts] 비어있음'); return; }
  const arr = [];
  snap.forEach(doc => {
    const d = { id: doc.id, ...doc.data() };
    delete d._isDraft;
    arr.push(d);
  });
  arr.sort((a, b) => {
    const wa = (a.week || '').localeCompare(b.week || '');
    return wa !== 0 ? wa : a.id.localeCompare(b.id);
  });
  // serialize each item for direct paste into the PROBLEMS array
  const body = arr.map(p => JSON.stringify(p, null, 2)).join(',\n') + ',';
  // group header comments by week
  let grouped = '';
  let curWeek = null;
  for (const p of arr) {
    if (p.week !== curWeek) {
      curWeek = p.week;
      grouped += `\n/* ── ${curWeek} ────────────────── */\n`;
    }
    grouped += JSON.stringify(p, null, 2) + ',\n';
  }
  try {
    await navigator.clipboard.writeText(grouped);
    console.log(`[drafts] ${arr.length} problem(s) copied to clipboard.\n-> Paste inside the PROBLEMS array in index.html and commit & push.\n-> After deploying, call window.removeAllDrafts() to clean up Firestore.`);
    console.table(arr.map(p => ({ id: p.id, week: p.week, title: p.title })));
  } catch (e) {
    console.log(grouped);
    console.warn('Clipboard copy failed. Copy the text above manually.');
  }
  return arr;
};

/* ─── Class progress summary (admin/TA only) ─── */
let _classProgressCache = null;  // { students: [...], loadedAt: Date }
const _CLASS_CACHE_KEY = 'oj_class_progress_v1';
const _CLASS_CACHE_TTL = 30 * 60 * 1000;  // 30 min TTL (saves Firestore reads)

function _saveClassCache(data){
  try {
    localStorage.setItem(_CLASS_CACHE_KEY, JSON.stringify({
      loadedAt: data.loadedAt.toISOString(),
      students: data.students.map(s => ({ ...s, completed: [...s.completed] })),
    }));
  } catch(e) {}
}
function _restoreClassCache(){
  try {
    const raw = localStorage.getItem(_CLASS_CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    const loadedAt = new Date(obj.loadedAt);
    if (Date.now() - loadedAt.getTime() > _CLASS_CACHE_TTL) return null;
    return {
      loadedAt,
      students: obj.students.map(s => ({ ...s, completed: new Set(s.completed) })),
    };
  } catch(e) { return null; }
}

async function _loadClassProgress(force=false){
  if (!isAdmin() && !isTA()) return null;
  if (!force && _classProgressCache) return _classProgressCache;
  // try localStorage cache (30 min TTL)
  if (!force) {
    const restored = _restoreClassCache();
    if (restored) {
      _classProgressCache = restored;
      return _classProgressCache;
    }
  }
  if (!SHEETS_URL) return null;
  try {
    // fetch submission data from Sheets only (0 Firestore reads)
    // NOTE: legacy collectionGroup('history') cost ~1,650 reads, users.get() ~55 reads
    //   staff exclusion: Apps Script EXCLUDE list + client-side name filter
    //   unapproved users cannot submit and never appear in Sheets -> assume approved:true
    const sheetRes = await fetch(SHEETS_URL + '?mode=admin&key=' + SHEETS_KEY, { method:'GET', mode:'cors' });
    if (!sheetRes.ok) throw new Error('sheets fetch failed: ' + sheetRes.status);
    const d = await sheetRes.json();
    const subs = d.submissions || [];

    // aggregate by student (based on Sheets submissions)
    const byUser = {};
    subs.forEach(s => {
      if (!s.username) return;
      if (!byUser[s.username]) byUser[s.username] = { completed: new Set(), submitCount: 0 };
      byUser[s.username].completed.add(s.pid);
      byUser[s.username].submitCount += 1;
    });

    // exclude staff names (Apps Script EXCLUDE handles admin; add TA names here if needed)
    const STAFF_NAMES = ['원경호'];
    const students = [];
    Object.entries(byUser).forEach(([username, agg]) => {
      if (STAFF_NAMES.some(n => username.includes(n))) return;
      students.push({
        username,
        email: '',
        approved: true,
        completed: agg.completed,
        submitCount: agg.submitCount,
      });
    });

    _classProgressCache = { students, loadedAt: new Date() };
    _saveClassCache(_classProgressCache);
    return _classProgressCache;
  } catch(e) {
    console.warn('_loadClassProgress error', e);
    return null;
  }
}

function renderHome(push=true){
  _taCleanup();
  if(push) history.pushState({view:'home'},'',' ');
  view = 'home';
  const hist = loadHistory();
  // final tab state
  const hasQuizTab = PROBLEMS.some(p => p.final && (!p._isDraft || isAdmin() || isTA()) && _userAllowed(p));
  if (!window._homeTab) window._homeTab = hasQuizTab ? 'final' : 'assign';
  const _visibleProbs = window._homeTab === 'final'
    ? PROBLEMS.filter(p => p.final && (!p._isDraft || isAdmin() || isTA()) && _userAllowed(p))
    : PROBLEMS.filter(p => !p.final);
  // group by week
  const groups = {};
  _visibleProbs.forEach(p => {
    const w = p.week;
    if (!groups[w]) groups[w] = [];
    groups[w].push(p);
  });
  // sort within each week: basic/practice first -> challenge last, then ascending number
  const _sortKey = (p) => {
    const id = p.id || '';
    const isChallenge = /c\d/.test(id);   // c1, uc1, lc1, stc1... -> challenge
    const num = parseInt(id.replace(/\D/g,''), 10) || 0;
    return (isChallenge ? 1000 : 0) + num;
  };
  Object.keys(groups).forEach(w => {
    // stable sort: equal keys preserve original order
    groups[w] = groups[w]
      .map((p, i) => ({ p, i, k: _sortKey(p) }))
      .sort((a, b) => a.k - b.k || a.i - b.i)
      .map(x => x.p);
  });
  // leaderboard rank (also used in userCardHtml)
  const myName = username ? (username.split('_')[1] || username) : null;
  const myRankIdx = username ? _leaderboard.findIndex(item => item.name === username) : -1;
  const myRank = myRankIdx >= 0 ? myRankIdx + 1 : 0;
  const showMyRow = myRank > 10;

  // duplicate name handling: show last 3 digits of student ID if names conflict
  function lbDisplayName(fullName) {
    const parts = fullName.split('_');
    const name = parts.length >= 2 ? parts[1] : fullName;
    const sid  = parts.length >= 2 ? parts[0] : '';
    const isDup = _leaderboard.filter(x => {
      const xp = x.name.split('_');
      return (xp.length >= 2 ? xp[1] : x.name) === name;
    }).length > 1;
    return (isDup && sid.length >= 3) ? `${name}(${sid.slice(-3)})` : name;
  }

  // user welcome card
  const userCardHtml = (() => {
    if (!firebaseUser) return `
      <div style="font-size:13px;color:var(--text3);margin-bottom:.7rem;line-height:1.5">로그인 후<br>과제를 제출하세요</div>

    const sname = parts[1] || username;
    if (!isApproved) return `
      <div style="font-size:22px;margin-bottom:.2rem">⏳</div>

      <button onclick="doLogout()" class="link-btn" style="font-size:11px;color:var(--text5)">로그아웃</button>`;
    const rankEmoji = myRank===1?'👑':myRank===2?'🥈':myRank===3?'🥉':'👋';
    const rankLabel = myRank>=1&&myRank<=3 ? `<div style="font-size:11px;font-weight:700;color:${myRank===1?'#D4AF37':myRank===2?'#888':'#B07D50'};margin:.15rem 0 .5rem;letter-spacing:.03em">${myRank}위 · ${myRank===1?'🎉 전체 1위!':myRank===2?'상위권':'Top 3'}</div>` : `<div style="font-size:11px;color:var(--text3);margin-bottom:.65rem">환영합니다${myRank>0?` (${myRank}위)`:''}</div>`;
    return `

  // notice
  const noticeHtml = NOTICE

  // sidebar: unsubmitted list (assignments only, no practice)
  const now = new Date();
  const upcoming = PROBLEMS

  const showAll = window._sidebarAll || false;

  // leaderboard (podium style)
  const leaderboardHtml = (() => {

    const totalHtml = _leaderboard.length > 10

    const myRowHtml = isAdmin()
      ? ''
      : showMyRow ? `<div style="display:flex;align-items:center;gap:6px;padding:.25rem .4rem;margin-top:.3rem;

  // progress (assignment/practice split) — drafts excluded from total (not visible to students)
  const assignProbs    = PROBLEMS.filter(p => !p.noSubmit && !p._isDraft && !p.final);
  const practiceProbs  = PROBLEMS.filter(p =>  p.noSubmit && !p._isDraft && !p.final);
  const doneAssign     = assignProbs.filter(p => hist[p.id] && hist[p.id].length > 0).length;
  const donePractice   = practiceProbs.filter(p => hist[p.id] && hist[p.id].length > 0).length;
  const totalAssign    = assignProbs.length;
  const totalPractice  = practiceProbs.length;
  const totalAll       = totalAssign + totalPractice;
  const doneAll        = doneAssign  + donePractice;
  const pctAssign      = totalAssign   > 0 ? Math.round(doneAssign   / totalAssign   * 100) : 0;
  const pctPractice    = totalPractice > 0 ? Math.round(donePractice / totalPractice * 100) : 0;
  const pctAll         = totalAll      > 0 ? Math.round(doneAll      / totalAll      * 100) : 0;
  // donut chart calculation
  const _r = 36, _cx = 50, _cy = 50;
  const _circ = parseFloat((2 * Math.PI * _r).toFixed(2));
  const _aSlice = totalAll > 0 ? parseFloat(((doneAssign   / totalAll) * _circ).toFixed(2)) : 0;
  const _pSlice = totalAll > 0 ? parseFloat(((donePractice / totalAll) * _circ).toFixed(2)) : 0;
  const _rSlice = parseFloat((_circ - _aSlice - _pSlice).toFixed(2));
  const progressHtml = `
    <div style="margin-bottom:.7rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem">
        <span style="font-size:11px;font-weight:600;color:var(--text2)">과제</span>

        <div style="height:100%;width:${pctAssign}%;background:${pctAssign===100?'var(--accent)':'var(--text)'};border-radius:4px;transition:width .4s"></div>
      </div>
    </div>
    <div style="margin-bottom:.85rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem">
        <span style="font-size:11px;font-weight:600;color:var(--text2)">연습문제</span>
        <span style="font-size:11px;color:var(--text3)">${donePractice} / ${totalPractice}문제&nbsp;
          <b style="color:var(--text)">${pctPractice}%</b></span>
      </div>
      <div style="height:7px;background:var(--surface4);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${pctPractice}%;background:var(--accent);border-radius:4px;transition:width .4s"></div>
      </div>
    </div>
    <div style="border-top:1px solid var(--surface4);padding-top:.75rem">
      <div style="font-size:11px;font-weight:600;color:var(--text2);margin-bottom:.6rem">종합 진행률</div>
      <div style="display:flex;align-items:center;gap:14px">
        <svg width="84" height="84" viewBox="0 0 100 100" style="flex-shrink:0">
          <circle cx="${_cx}" cy="${_cy}" r="${_r}" fill="none" stroke="var(--surface4)" stroke-width="16"/>
          ${_rSlice > 0.01 ? `<circle cx="${_cx}" cy="${_cy}" r="${_r}" fill="none" stroke="var(--incomplete)" stroke-width="16"
            stroke-dasharray="${_rSlice} ${_circ}" stroke-dashoffset="${-(_aSlice+_pSlice)}"
            transform="rotate(-90 ${_cx} ${_cy})"/>` : ''}
          ${_aSlice > 0.01 ? `<circle cx="${_cx}" cy="${_cy}" r="${_r}" fill="none" stroke="var(--text)" stroke-width="16"

            transform="rotate(-90 ${_cx} ${_cy})"/>` : ''}
          ${_pSlice > 0.01 ? `<circle cx="${_cx}" cy="${_cy}" r="${_r}" fill="none" stroke="var(--accent)" stroke-width="16"
            stroke-dasharray="${_pSlice} ${_circ}" stroke-dashoffset="${-_aSlice}"
            transform="rotate(-90 ${_cx} ${_cy})"/>` : ''}
          <text x="${_cx}" y="${_cy}" text-anchor="middle" dominant-baseline="middle"
            font-size="15" font-weight="700" fill="var(--text)" font-family="-apple-system,BlinkMacSystemFont,sans-serif">${pctAll}%</text>

          <div style="display:flex;align-items:center;gap:6px">

            <span style="color:var(--text4)">미완료&nbsp;${totalAll - doneAll}</span>
          </div>
          ${pctAll===100 ? `<div style="font-size:11px;color:var(--accent-text);font-weight:600;margin-top:2px">모두 완료!</div>` : ''}
        </div>
      </div>
    </div>`;

  // admin/TA only: home sidebar mode (class=student summary / mine=my submissions)
  const _homeProgMode = (isAdmin() || isTA()) ? (window._homeProgMode || 'class') : 'mine';
  // admin/TA only: student summary in home sidebar (vertical layout)
  let classSidebarHtml = '';
  if (isAdmin() || isTA()) {
    if (!_classProgressCache) {
      classSidebarHtml = `<div style="font-size:12px;color:var(--text3);text-align:center;padding:.7rem 0">

      const _practicePids = practiceProbs.map(p => p.id);

        doneA: _assignPids.filter(pid => s.completed.has(pid)).length,

      const nT = wc.length;
      const nAll = wc.filter(s => _assignPids.length > 0 && s.doneA === _assignPids.length).length;
      const nZero = wc.filter(s => s.doneA === 0).length;
      const avgA = nT > 0 ? wc.reduce((a,s)=>a+s.doneA,0) / nT : 0;
      const avgP = nT > 0 ? wc.reduce((a,s)=>a+s.doneP,0) / nT : 0;
      const pctA = _assignPids.length > 0 ? Math.round(avgA / _assignPids.length * 100) : 0;
      const pctP = _practicePids.length > 0 ? Math.round(avgP / _practicePids.length * 100) : 0;
      const avgSub = nT > 0 ? (wc.reduce((a,s)=>a+s.sub,0) / nT).toFixed(1) : '0';
      classSidebarHtml = `

            <span style="font-size:11px;color:var(--text3)">${avgA.toFixed(1)} / ${_assignPids.length}문제&nbsp;<b style="color:var(--text)">${pctA}%</b></span>

            <div style="height:100%;width:${pctA}%;background:${pctA===100?'var(--accent)':'var(--text)'};border-radius:4px;transition:width .4s"></div>
          </div>
        </div>
        <div style="margin-bottom:.85rem" title="수강생 1명당 평균적으로 완료한 연습 문제 수">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.3rem">
            <span style="font-size:11px;font-weight:600;color:var(--text2)">연습 진행률 <span style="color:var(--text5);font-weight:400">(1인당)</span></span>
            <span style="font-size:11px;color:var(--text3)">${avgP.toFixed(1)} / ${_practicePids.length}문제&nbsp;<b style="color:var(--text)">${pctP}%</b></span>
          </div>
          <div style="height:7px;background:var(--surface4);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${pctP}%;background:var(--accent);border-radius:4px;transition:width .4s"></div>
          </div>
        </div>
        <div style="border-top:1px solid var(--surface4);padding-top:.7rem;display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
          <div style="text-align:center" title="전체 수강생 수">
            <div style="font-size:18px;font-weight:700;color:var(--text)">${nT}</div>
            <div style="font-size:10px;color:var(--text3)">수강생</div>
          </div>
          <div style="text-align:center" title="모든 과제를 완료한 수강생 수">
            <div style="font-size:18px;font-weight:700;color:var(--accent-text)">${nAll}</div>
            <div style="font-size:10px;color:var(--text3)">과제 완주자</div>
          </div>
          <div style="text-align:center" title="과제를 하나도 제출하지 않은 수강생 수">
            <div style="font-size:18px;font-weight:700;color:#c44">${nZero}</div>
            <div style="font-size:10px;color:var(--text3)">과제 미착수</div>
          </div>
          <div style="text-align:center" title="수강생 1명당 평균 제출 시도 횟수 (같은 문제 재제출 포함)">
            <div style="font-size:18px;font-weight:700;color:var(--text2)">${avgSub}</div>
            <div style="font-size:10px;color:var(--text3)">1인 시도수</div>
          </div>
        </div>`;
    }
  }

  const sidebarPinnedHtml = upcoming.length === 0
    ? `<div style="font-size:12px;color:var(--text4)">모두 제출 완료!</div>`
    : display.map(p => {
        const dday = Math.ceil((new Date(p.deadline) - now) / 86400000);
        const ddayStr = dday === 0 ? 'D-day' : `D-${dday}`;
        const ddayColor = dday <= 3 ? 'var(--error)' : 'var(--text3)';
        return `<div onclick="goProb('${p.id}')" style="cursor:pointer;display:flex;
          align-items:center;gap:8px;padding:.4rem 0;border-bottom:1px solid var(--surface4)">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.title}</div>
            <div style="font-size:11px;color:var(--text4)">${p.week}</div>
          </div>
          <div style="font-size:11px;font-weight:600;color:${ddayColor};white-space:nowrap">${ddayStr}</div>
        </div>`;
      }).join('')
    + (upcoming.length > 5 && !showAll
        ? `<div style="text-align:center;margin-top:.5rem">
            <button onclick="window._sidebarAll=true;renderHome(false)" 
              style="font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;padding:0">
              +${upcoming.length-5}개 더보기
            </button></div>`
        : '');

  // week sort: assignment weeks newest-first, noSubmit practice groups always at the bottom
  const noSubmitWeeks = new Set();

        <textarea id="code-ta" spellcheck="false">${code}</textarea>
        <div id="ta-display" style="display:none;align-items:center;gap:8px;padding:.4rem .75rem;margin-bottom:.5rem;background:var(--surface3);border-radius:8px;border:1.5px solid var(--error)">
          <span style="font-size:10px;font-weight:600;color:var(--error);letter-spacing:.05em">⏱ TIME ATTACK</span>
          <span id="ta-clock" style="font-family:'Menlo','Consolas',monospace;font-size:17px;font-weight:700;color:var(--text);letter-spacing:.05em">00:00</span>
          <button onclick="stopTimeAttack()" style="margin-left:auto;font-size:11px;padding:2px 7px;color:var(--error);border:1px solid var(--error);background:none;border-radius:4px;cursor:pointer">종료</button>
        </div>
        <div class="btn-row">
          ${p.final ? '<button class="primary" id="sub-btn" onclick="doSubmit()">제출</button>' : p.noSubmit ? '<button class="primary" id="sub-btn" onclick="doSubmit()" style="background:var(--link);border-color:var(--link)" title="제출 순위에 반영됩니다 (성적 무관)">제출 (순위 반영)</button>' : '<button class="primary" id="sub-btn" onclick="doSubmit()">제출</button>'}
          <button id="test-btn" onclick="doTest()">테스트 실행</button>
          <button onclick="doReset()">초기화</button>
          ${p.final ? '' : '<button id="ta-btn" onclick="startTimeAttack()" style="margin-left:auto;font-size:12px;color:#e94560;border-color:#e94560" title="타임어택: 복붙 차단 후 타이머 시작">⏱ 타임어택</button>'}`}
        </div>
        ${p.final ? '' : `
        <div style="display:flex;align-items:center;gap:10px;padding:.5rem .75rem;margin-bottom:.75rem;background:var(--surface3);border:1px solid var(--border);border-radius:6px;font-size:12px;flex-wrap:wrap">
          <button id="diff-btn" onclick="toggleDifficulty('${p.id}')" style="font-size:12px;padding:4px 10px;cursor:pointer" title="이 문제가 많이 어려우면 눌러주세요 (한 번 더 누르면 취소)">😵 어려워요 <span id="diff-count">-</span></button>
          <span style="color:var(--text4)">많이 어려우면 교수님이 힌트를 드려요</span>
        </div>
        <details style="margin-bottom:.75rem;font-size:12px;color:var(--text3)">
          <summary style="cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:4px">
            <span style="font-size:10px">▶</span> 채점 결과 안내
          </summary>
          <div style="margin-top:.5rem;display:flex;flex-direction:column;gap:4px;padding-left:4px">
            <div><span class="badge pass" style="font-size:10px;min-width:70px">정답</span> &nbsp;출력이 기댓값과 완전히 일치</div>
            <div><span class="badge fail" style="font-size:10px;min-width:70px">오답</span> &nbsp;출력이 다르거나 출력 없음</div>
            <div><span class="badge fail" style="font-size:10px;min-width:70px">컴파일 오류</span> &nbsp;문법 오류로 컴파일 실패</div>
            <div><span class="badge fail" style="font-size:10px;min-width:70px">시간 초과</span> &nbsp;무한루프 등 실행 시간 초과</div>
            <div><span class="badge fail" style="font-size:10px;min-width:70px">런타임 오류</span> &nbsp;실행 중 비정상 종료 (segfault 등)</div>
            <div><span class="badge fail" style="font-size:10px;min-width:70px">서버 혼잡</span> &nbsp;채점 서버 과부하 — 잠시 후 재시도</div>
          </div>
        </details>`}
        <div id="results"></div>
      </div>
    </div>`;

  /* CodeMirror initialization */
  const ta = $('code-ta');
  if (p.subjective && ta) {
    // 주관식: CodeMirror 없이 일반 textarea + draft 저장
    window._cm = null;
    const draft = sessionStorage.getItem('draft:'+pid);
    if (draft) ta.value = draft;
    ta.addEventListener('input', e => { sessionStorage.setItem('draft:'+pid, e.target.value); });
  } else if (ta && typeof CodeMirror !== 'undefined'){
    window._cm = CodeMirror.fromTextArea(ta, {
      mode: 'text/x-csrc',
      lineNumbers: true,
      indentUnit: 4,
      tabSize: 4,
      indentWithTabs: false,
      extraKeys: {
        Tab: (cm) => cm.replaceSelection('    '),
        'Shift-Tab': (cm) => {
          cm.operation(() => {
            cm.listSelections().forEach(sel => {
              for (let l = sel.from().line; l <= sel.to().line; l++) {
                const m = cm.getLine(l).match(/^ {1,4}/);
                if (m) cm.replaceRange('', {line:l, ch:0}, {line:l, ch:m[0].length});
              }
            });
          });
        },
      },
      lineWrapping: false,
      autofocus: false,
      theme: document.body.classList.contains('dark') ? 'dracula' : 'default',
    });
    const draft = sessionStorage.getItem('draft:'+pid);
    window._cm.setValue(draft || code);
    if(draft) code = draft;
    window._cm.on('change', () => {
      code = window._cm.getValue();
      sessionStorage.setItem('draft:'+curPid, code);
    });
  } else if (ta) {
    ta.style.display = 'block';
    ta.addEventListener('input', e => { code = e.target.value; });
    ta.addEventListener('keydown', function(e){
      if (e.key === 'Tab'){
        e.preventDefault();
        if (e.shiftKey) {
          const s = this.selectionStart;
          const lineStart = this.value.lastIndexOf('\n', s - 1) + 1;
          const m = this.value.slice(lineStart).match(/^ {1,4}/);
          if (m) {
            this.value = this.value.substring(0, lineStart) + this.value.substring(lineStart + m[0].length);
            this.selectionStart = this.selectionEnd = Math.max(lineStart, s - m[0].length);
            code = this.value;
          }
        } else {
          const s = this.selectionStart, end = this.selectionEnd;
          this.value = this.value.substring(0, s) + '    ' + this.value.substring(end);
          this.selectionStart = this.selectionEnd = s + 4;
          code = this.value;
        }
      }
    });
  }
  window._cm = window._cm || null;

  /* Load and render professor comment (post-it) */
  renderProfNote(pid);

  /* Load difficulty count */
  loadDifficulty(pid);
}

function renderProfNote(pid, editing){
  const slot = $('prof-note-slot');
  if (!slot) return;
  const staff = isAdmin() || isTA();
  const cached = window._notesCache[pid];
  if (cached === undefined && !editing) {
    slot.innerHTML = '';
    loadNote(pid).then(() => {
      if (curPid === pid) renderProfNote(pid);
    });
    return;
  }
  const text = cached || '';
  if (!text && !staff) { slot.innerHTML = ''; return; }

  if (editing) {
    slot.innerHTML = `
      <div class="prof-note" open>
        <summary>💡 교수님 코멘트 <span style="font-size:10px;color:var(--text4);font-weight:400;margin-left:auto">편집 중</span></summary>
        <div style="padding:.4rem .95rem .2rem 1.55rem">
          <textarea id="prof-note-ta" placeholder="여기에 힌트나 코멘트를 입력하세요. 줄바꿈은 그대로 표시됩니다.">${escapeHtml(text)}</textarea>
        </div>
        <div class="prof-note-actions">
          <button class="primary" onclick="submitProfNote('${pid}')">저장</button>
          <button onclick="renderProfNote('${pid}')">취소</button>
        </div>
      </div>`;
    const ta = $('prof-note-ta');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    return;
  }

  const bodyHtml = text
    ? escapeHtml(text)
    : '<span class="prof-note-empty">(코멘트 없음)</span>';
  const actions = staff
    ? `<div class="prof-note-actions">
         <button onclick="renderProfNote('${pid}', true)">${text ? '편집' : '+ 코멘트 추가'}</button>
         ${text ? `<button class="danger" onclick="clearProfNote('${pid}')">삭제</button>` : ''}
       </div>`
    : '';
  slot.innerHTML = `
    <details class="prof-note"${text ? '' : ' open'}>
      <summary>💡 교수님 코멘트<span class="prof-note-hint">충분히 고민해본 다음 열어보세요</span></summary>
      <div class="prof-note-body">${bodyHtml}</div>
      ${actions}
    </details>`;
}

window.submitProfNote = async function(pid){
  const ta = $('prof-note-ta');
  if (!ta) return;
  const text = ta.value;
  try {
    await saveNote(pid, text);
    renderProfNote(pid);
  } catch (e) { /* alert handled in saveNote */ }
};
window.clearProfNote = async function(pid){
  if (!confirm('이 문제의 교수 코멘트를 삭제할까요?')) return;
  try {
    await saveNote(pid, '');
    renderProfNote(pid);
  } catch (e) {}
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function switchTab(t){
  curTab = t;
  $('prob-panel').style.display   = t === 'prob'   ? 'block' : 'none';
  $('editor-panel').style.display = t === 'editor' ? 'block' : 'none';
  $('tab-prob').className   = 'tab' + (t === 'prob'   ? ' active' : '');
  $('tab-editor').className = 'tab' + (t === 'editor' ? ' active' : '');
}

function renderResults(){
  const p = _curProb || PROBLEMS.find(x => x.id === curPid);
  if (!p || !$('results')) return;
  if (p.subjective) return;

  if (p.final) {
    const rows = p.cases.map((tc, i) => {
      const r = tcResults[tc.id];
      let cls = '', badge = '', outputHtml = '';
      if (!r) badge = '<span class="badge wait">대기</span>';
      else if (r.status === 'running') badge = '<span class="badge run">테스트중</span>';
      else if (r.status === 'fail' && r.detail) {
        // 컴파일 오류, 런타임 오류, 시간 초과 등 실제 에러만 표시
        cls = 'tc-fail';
        badge = `<span class="badge fail">${r.msg || '오류'}</span>`;
        outputHtml = `<div class="tc-detail">${r.detail}</div>`;
      } else {
        badge = '<span class="badge" style="background:var(--run-badge-bg);color:var(--run-badge-tx)">테스트</span>';
        const tcInput = tc.input||'';
        const isMultiIn = tcInput.includes('\n') && tcInput.trimEnd().includes('\n');
        const isMultiOut = (r.stdout||'').includes('\n');
        const inputHtml = tcInput
          ? (isMultiIn
            ? `<div class="tc-detail">입력:<br><code style="display:block;white-space:pre-wrap;margin-top:2px;padding:4px 6px;background:var(--surface3);border-radius:4px">${tcInput.trimEnd()}</code></div>`
            : `<div class="tc-detail">입력: <code>${tcInput.trimEnd()}</code></div>`)
          : '';
        outputHtml = inputHtml
          + (r.stdout !== undefined
            ? (isMultiOut
              ? `<div class="tc-detail">출력:<br><code style="display:block;white-space:pre-wrap;margin-top:2px;padding:4px 6px;background:var(--surface3);border-radius:4px">${r.stdout||'(없음)'}</code></div>`
              : `<div class="tc-detail">출력: <code>${r.stdout||'(없음)'}</code></div>`)
            : '');
      }
      return `<div class="tc-row ${cls}">
        ${badge}
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;color:var(--text3)">TC ${i+1}</div>
          ${outputHtml}
        </div>
      </div>`;
    }).join('');
    $('results').innerHTML = `<div class="tc-list">${rows}</div>`;
    return;
  }

  let total = 0, max = 0;
  p.cases.forEach(tc => {
    max += tc.pts;
    if (tcResults[tc.id]?.status === 'pass') total += tc.pts;
  });
  const done = !submitting && Object.keys(tcResults).length > 0;

  const rows = p.cases.map(tc => {
    const r = tcResults[tc.id];
    let cls = '', badge = '', detail = '', perf = '';
    if (!r)
      badge = '<span class="badge wait">대기</span>';
    else if (r.status === 'running')
      { cls = ''; badge = '<span class="badge run">채점중</span>'; }
    else if (r.status === 'pass'){
      cls = 'tc-pass';
      badge = '<span class="badge pass">정답</span>';
      if (r.time || r.memory)
        perf = `<div class="tc-perf">${r.time ? r.time+'s' : ''}${r.time && r.memory ? ' · ' : ''}${r.memory ? r.memory+'KB' : ''}</div>`;
      if (r.stdout !== undefined){
        const inputPreview = (r.input||'').replace(/\n/g,' / ').slice(0,40);
        const isMulti = (r.stdout||'').includes('\n');
        detail = (inputPreview ? `<div class="tc-detail">입력: <code>${inputPreview}</code></div>` : '')
               + (isMulti
                  ? `<div class="tc-detail">출력:<br><code style="display:block;white-space:pre-wrap;margin-top:2px;padding:4px 6px;background:var(--surface3);border-radius:4px">${r.stdout||'(없음)'}</code></div>`
                  : `<div class="tc-detail">출력: <code>${r.stdout||'(없음)'}</code></div>`);
      }
    } else {
      cls = 'tc-fail';
      badge = `<span class="badge fail">${r.msg || '오답'}</span>`;
      if (r.detail)
        detail = `<div class="tc-detail">${r.detail}</div>`;
      else if (r.stdout !== undefined){
        const inputPreview = (r.input||'').replace(/\n/g,' / ').slice(0,40);
        const isMultiOut = (r.stdout||'').includes('\n');
        const isMultiExp = (r.expected||'').includes('\n');
        const outHtml = isMultiOut
          ? `<code style="display:block;white-space:pre-wrap;margin-top:2px;padding:4px 6px;background:var(--surface3);border-radius:4px">${r.stdout||'(없음)'}</code>`
          : `<code>${r.stdout||'(없음)'}</code>`;
        const expHtml = isMultiExp
          ? `<code style="display:block;white-space:pre-wrap;margin-top:2px;padding:4px 6px;background:var(--accent-bg);border-radius:4px">${r.expected}</code>`
          : `<code>${r.expected}</code>`;
        detail = `<div class="tc-detail">입력: <code>${inputPreview}</code></div>
                  <div class="tc-detail">출력: ${outHtml}</div>
                  <div class="tc-detail">기댓값: ${expHtml}</div>`;
      }
    }
    return `<div class="tc-row ${cls}">
      ${badge}
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:var(--text3)">TC ${tc.id} &nbsp; ${tc.pts}점</div>
        ${detail}${perf}
      </div>
    </div>`;
  }).join('');

  $('results').innerHTML = `
    ${done ? `<div class="score-bar">
      <span style="font-size:19px;font-weight:600">${total} / ${max}점</span>
      ${total===max ? '<span style="font-size:13px;color:var(--accent-text);margin-left:auto;font-weight:600">모두 정답!</span>' : ''}
    </div>` : ''}
    <div class="tc-list">${rows}</div>`;
}

/* Submission history */
window._histCodes = [];
function viewHistCode(idx){
  const d = window._histCodes[idx];
  if (d && d.code) showCode(d.code, d.title, d.ts);
  else alert('저장된 코드가 없습니다.');
}

function renderHistory(push=true){
  if (PROBLEMS.some(p=>p.final) && !isAdmin() && !isTA()) { renderHome(); return; }
  if(push) history.pushState({view:'history'},'',' ');
  view = 'history';
  window._histCodes = [];
  const hist = loadHistory();
  // group by week and calculate rowspan
  const weekGroups = [];
  PROBLEMS.forEach(p => {
    const entries = hist[p.id] || [];
    const rowCount = Math.max(1, entries.length);
    const last = weekGroups[weekGroups.length - 1];
    if (last && last.week === p.week) {
      last.problems.push(p);
      last.totalRows += rowCount;
    } else {
      weekGroups.push({ week: p.week, problems: [p], totalRows: rowCount });
    }
  });

  let firstInWeek = new Set(weekGroups.map(g => g.problems[0].id));

  const rows = weekGroups.flatMap(g =>
    g.problems.flatMap((p, pi) => {
      const entries = hist[p.id] || [];
      const weekParts = g.week.split(/\s*\(/);
      const weekHtml = weekParts.length > 1
        ? `${weekParts[0]}<br><span style="font-size:11px;color:var(--text4)">(${weekParts[1]}</span>`
        : g.week;
      const tdWeek = pi === 0
        ? `<td rowspan="${g.totalRows}" style="font-size:13px;font-weight:600;color:var(--text2);vertical-align:middle;padding:.6rem .9rem;border-right:1px solid var(--border);white-space:nowrap;line-height:1.5">${weekHtml}</td>`
        : '';
      const tdStyle = 'padding:.45rem .9rem;font-size:13px;border-bottom:1px solid var(--surface4)';
      if (!entries.length) return [`<tr>
        ${tdWeek}
        <td style="${tdStyle}"><span style="font-size:11px;font-family:monospace;color:var(--text4);margin-right:5px">${p.id}</span>${p.title}</td>
        <td style="${tdStyle}" colspan="3"><span style="color:var(--text5);font-size:12px">미제출</span></td>
      </tr>`];
      return entries.map((e, i) => {
        const hasScore = e.score !== null && e.score !== undefined && !isNaN(e.score);
        const scoreColor = hasScore ? (e.score === e.max ? 'var(--accent-text)' : e.score > 0 ? 'var(--partial)' : 'var(--error)') : 'var(--accent-text)';
        const scoreCell = `<span style="color:${scoreColor};font-weight:600;font-size:12px;white-space:nowrap">제출됨${hasScore ? ` (${e.score}/${e.max}점)` : ''}</span>`;
        const codeIdx = window._histCodes.length;
        window._histCodes.push({ code: e.code || '', title: p.title, ts: new Date(e.ts).toLocaleString('ko-KR') });
        const codeBtn = e.code
          ? `<button onclick="viewHistCode(${codeIdx})" style="font-size:11px;padding:2px 7px;color:var(--link);border-color:var(--link)">코드 보기</button>`
          : `<span style="font-size:11px;color:var(--text5)">-</span>`;
        return `<tr>
          ${i === 0 ? tdWeek : ''}
          <td style="${tdStyle}">${i===0?`<span style="font-size:11px;font-family:monospace;color:var(--text4);margin-right:5px">${p.id}</span>${p.title}`:''}</td>
          <td style="${tdStyle};white-space:nowrap">${scoreCell}</td>
          <td style="${tdStyle};color:var(--text3);font-size:11px;white-space:nowrap">${new Date(e.ts).toLocaleString('ko-KR')}</td>
          <td style="${tdStyle};text-align:center">${codeBtn}</td>
        </tr>`;
      });
    })
  ).join('');

  // calculate progress
  // exclude drafts from total (not visible to students)
  const _hAssign   = PROBLEMS.filter(p => !p.noSubmit && !p._isDraft);
  const _hPractice = PROBLEMS.filter(p =>  p.noSubmit && !p._isDraft);
  const _hDA = _hAssign.filter(p => hist[p.id]?.length > 0).length;
  const _hDP = _hPractice.filter(p => hist[p.id]?.length > 0).length;
  const _hTA = _hAssign.length, _hTP = _hPractice.length;
  const _hPA = _hTA > 0 ? Math.round(_hDA/_hTA*100) : 0;
  const _hPP = _hTP > 0 ? Math.round(_hDP/_hTP*100) : 0;

  // top card mode (admin/TA can toggle, default: class)
  const _isStaff = isAdmin() || isTA();
  if (_isStaff && window._topStatsMode === undefined) window._topStatsMode = 'class';
  const _topMode = _isStaff ? (window._topStatsMode || 'class') : 'mine';

  // class status (admin/TA only)
  const classStatsHtml = (() => {
    if (!isAdmin() && !isTA()) return '';
    const isOpen = !!window._classStatsOpen;
    const toggleBtn = `<button id="_classStatsBtn" onclick="_toggleClassProgress()"
      style="font-size:12px;padding:6px 12px;background:none;color:#D85A30;border:1px solid #D85A30;border-radius:6px;cursor:pointer;font-weight:600">
      ${isOpen ? '▲ 수강생 현황 닫기' : '▼ 👥 수강생 진행 현황 보기'}</button>`;
    if (!isOpen) return `<div style="margin:.85rem 0">${toggleBtn}</div>`;
    if (!_classProgressCache) {
      return `<div class="card" style="margin:.85rem 0;padding:1rem;text-align:center;color:var(--text3)">${toggleBtn}<div style="margin-top:.5rem">불러오는 중...</div></div>`;
    }

    const allStudents = _classProgressCache.students;
    const _assignPids = _hAssign.map(p => p.id);
    const _practicePids = _hPractice.map(p => p.id);

    // calculate completion count per student (assignments only)
    const withCounts = allStudents.map(s => {
      const doneAssign = _assignPids.filter(pid => s.completed.has(pid)).length;
      const donePractice = _practicePids.filter(pid => s.completed.has(pid)).length;
      return { ...s, doneAssign, donePractice, doneTotal: doneAssign + donePractice };
    });

    const total = withCounts.length;
    const allDone = withCounts.filter(s => s.doneAssign === _assignPids.length && _assignPids.length > 0).length;
    const zeroDone = withCounts.filter(s => s.doneAssign === 0).length;
    const avgAssign = total > 0 ? (withCounts.reduce((a,s) => a + s.doneAssign, 0) / total).toFixed(1) : '0';
    const avgSubmit = total > 0 ? (withCounts.reduce((a,s) => a + s.submitCount, 0) / total).toFixed(1) : '0';

    // completion count per problem
    const perProblem = [..._hAssign, ..._hPractice].map(p => {
      const count = withCounts.filter(s => s.completed.has(p.id)).length;
      const pct = total > 0 ? Math.round(count / total * 100) : 0;
      return { pid: p.id, title: p.title, week: p.week, noSubmit: !!p.noSubmit, count, pct };
    });

    // sort students by assignment completion (descending)

          불러오는 중...

      const _cAll = _classProgressCache.students;

      const withCounts = _cAll.map(s => {

      const nZero = withCounts.filter(s => s.doneA === 0).length;

  const topCardHtml = `<div class="card" style="margin-bottom:.85rem">${_topMode === 'class' ? classSummaryBody : myProgressCardBody}</div>`;

  $('app').innerHTML = `
    <div class="topbar">

    </div>

/* Actions */
function goProb(pid){
  if (!username){ doSetUser(() => renderProb(pid)); return; }
  if (!isApproved){ alert('승인 대기 중입니다. 교수님/TA의 승인 후 문제를 풀 수 있습니다.'); return; }
  renderProb(pid);
}

async function doSubmit(){
  if (submitting) return;
  if (!username){ doSetUser(() => doSubmit()); return; }
  if (!isApproved){ alert('승인 대기 중입니다. 교수님/TA의 승인 후 제출할 수 있습니다.'); return; }
  const p   = _curProb || PROBLEMS.find(x => x.id === curPid);
  const src = getCode();
  const _starter = (p.starter || STARTER);
  if (p.subjective) {
    if (!src.trim()){ alert('답안을 작성한 후 제출하세요.'); return; }
  } else if (!src.trim() || src.trim() === _starter.trim()){
    alert('코드를 작성한 후 제출하세요.'); return;
  }
  // ── final exam branch ──
  if (p.final) {
    const confirmed = confirm(`[기말] ${p.title}\n\n제출하시겠습니까?\n(채점은 시험 종료 후 이루어집니다)`);
    if (!confirmed) return;
    submitting = true;
    const btn = $('sub-btn');
    if (btn){ btn.disabled = true; btn.textContent = '제출 중...'; }
    const ts = new Date().toISOString();
    const outputs = p.subjective ? src.trim() : (p.cases||[]).map(tc => (tcResults[tc.id]?.stdout ?? '')).join(' | ');
    addHistory(p.id, { ts, submitted: true, score: null, max: null, code: src });
    sessionStorage.removeItem('draft:'+p.id);
    sendToSheets({ type:'final', ts, username, problemId: p.id, problem: p.title, outputs, code: src });
    submitting = false;
    if (btn){ btn.disabled = false; btn.textContent = '제출'; }
    if ($('results')){
      $('results').innerHTML = `<div style="padding:.85rem 1rem;background:var(--accent-bg);border:1px solid var(--accent);
        border-radius:8px;color:var(--accent-text);font-size:14px;font-weight:600">
        제출 완료 ✓ &nbsp;<span style="font-weight:400;font-size:12px">${new Date(ts).toLocaleString('ko-KR')}</span>
      </div>`;
    }
    return;
  }

  const isLate = !isOpen(p) && !p.noSubmit;
  const confirmMsg = p.noSubmit
    ? `[연습문제] ${p.title}\n\n제출 순위에 반영됩니다. (성적 무관)\n계속하시겠습니까?`
    : isLate
      ? `[지각 제출] ${p.title}\n\n마감이 지난 과제입니다. 감점될 수 있습니다.\n그래도 제출하시겠습니까?`
      : `${p.title} 과제를 제출하시겠습니까?\n\n제출 후에도 재제출이 가능합니다.`;
  if (!confirm(confirmMsg)) return;

  submitting = true;
  const btn = $('sub-btn');
  if (btn){ btn.disabled = true; btn.textContent = '제출 중...'; }

  const ts = new Date().toISOString();
  // include score if test results are available
  let submitScore = null, submitMax = null;
  if (Object.keys(tcResults).length > 0){
    let tot = 0, mx = 0;
    p.cases.forEach(tc => {
      mx += tc.pts;
      if (tcResults[tc.id]?.status === 'pass') tot += tc.pts;
    });
    submitScore = tot; submitMax = mx;
  }
  // check existing perfect score before adding, for mascot trigger
  const _wasPerfectBefore = (loadHistory()[p.id] || []).some(e => e.score != null && e.max != null && e.score >= e.max);
  addHistory(p.id, { ts, submitted: true, score: submitScore, max: submitMax, code: src });
  const _isFirstPerfect = !_wasPerfectBefore && submitScore != null && submitMax != null && submitScore >= submitMax;
  if (_isFirstPerfect && !isAdmin() && !isTA()) _checkMascotEvents(p.id, true);
  // summarize TC results
  const tcSummary = p.cases.map(tc => {
    const r = tcResults[tc.id];
    if (!r) return 'N';
    if (r.status === 'pass') return 'O';
    if (r.status === 'fail' && r.msg === '컴파일 오류') return 'E';
    return 'X';
  }).join('');

  sessionStorage.removeItem('draft:'+p.id);
  sendToSheets({
    ts, username, week: p.week, problemId: p.id, problem: p.title,
    code: src,
    score: submitScore, max: submitMax,
    tc: tcSummary || '',
    type: p.noSubmit ? 'practice' : 'assignment',
  });

  submitting = false;
  if (btn){ btn.disabled = false; btn.textContent = '제출'; }

  // check if first submission (excluding admin/TA)
  const isFirst = !_submitCounts[p.id];
  if (isFirst && username && !isAdmin() && !isTA()) {
    const sname = username.split('_')[1] || username;
    if (!_ratings[p.id] || !_ratings[p.id].firstSubmitter) {
      _ratings[p.id] = { ...(_ratings[p.id]||{}), firstSubmitter: sname };
      sendToSheets({ type:'first', problemId: p.id, name: sname });
      showFirstBadge();
    }
  }

  // result area: simple submission complete display
  if ($('results')){
    const lateTag = isLate ? ' &nbsp;<span style="color:var(--error);font-size:12px;font-weight:600">[지각]</span>' : '';
    $('results').innerHTML = `<div style="padding:.85rem 1rem;background:var(--accent-bg);border:1px solid var(--accent);
      border-radius:8px;color:var(--accent-text);font-size:14px;font-weight:600">
      제출 완료 ✓${lateTag} &nbsp;<span style="font-weight:400;font-size:12px">${new Date(ts).toLocaleString('ko-KR')}</span>
    </div>`;
  }

  // refresh leaderboard after submission
  setTimeout(fetchSubmitCounts, 2000);

  // rich feedback delivered via rating dialog popup
  setTimeout(() => showRatingDialog(p.id, {
    title: p.title,
    noSubmit: !!p.noSubmit,
    score: submitScore,
    max: submitMax,
    isLate,
    isFirst,
    ts,
  }), 600);
}

let testCooldown = 0;
let testCooldownTimer = null;

function startTestCooldown() {
  const testBtn = $('test-btn');
  testCooldown = 5;
  if (testBtn){ testBtn.disabled = true; testBtn.textContent = '5...'; }
  testCooldownTimer = setInterval(() => {
    testCooldown--;
    if (testCooldown > 0) {
      if (testBtn) testBtn.textContent = testCooldown + '...';
    } else {
      clearInterval(testCooldownTimer);
      testCooldownTimer = null;
      if (testBtn) { testBtn.disabled = false; testBtn.textContent = '테스트 실행'; }
    }
  }, 1000);
}

async function doTest(){
  if (submitting || testCooldown > 0) return;
  const _base = PROBLEMS.find(x => x.id === curPid);
  const _newCases = buildCases(curPid);
  if (_newCases) _curProb = Object.assign({}, _base, {cases: _newCases});
  const p = _curProb || _base;
  const src = getCode();
  submitting = true;
  const testBtn = $('test-btn');
  if (testBtn){ testBtn.disabled = true; testBtn.textContent = '실행 중...'; }
  // reset all TCs
  p.cases.forEach(tc => { tcResults[tc.id] = { status:'running' }; });
  renderResults();
  // run all TCs sequentially (prevent server overload)
  for (const tc of p.cases) {
    const result = await runCase(tc, src);
    if (result.status === 'fail' &&
        (result.msg === '네트워크 오류' || result.msg === '채점 서버 응답 없음')) {
      tcResults[tc.id] = { status:'fail', msg:'채점 서버 오류', detail:'IDE에서 실행 확인 후 제출 버튼을 눌러 주세요.' };
    } else {
      tcResults[tc.id] = result;
    }
    renderResults();
  }
  submitting = false;
  // start 15-second cooldown after grading
  startTestCooldown();
}

/* ── Time Attack ── */
function _taFmt(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h > 0
    ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
    : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function _blockPaste(e){ e.preventDefault(); return false; }
function startTimeAttack(){
  if (_taActive) return;
  if (!confirm('타임어택을 시작하면 코드 붙여넣기(Ctrl+V)가 차단됩니다.\n타이머는 종료 버튼을 누를 때까지 계속 흘러갑니다.\n\n시작하시겠습니까?')) return;
  _taActive = true; _taStart = Date.now();
  // block CodeMirror paste
  if (window._cm) window._cm.on('paste', _blockPaste);
  // block native paste events
  document.addEventListener('paste', _blockPaste, true);
  // switch UI state
  const disp = document.getElementById('ta-display');
  const btn  = document.getElementById('ta-btn');
  if (disp) disp.style.display = 'flex';
  if (btn)  btn.style.display  = 'none';
  // timer tick
  _taTimer = setInterval(() => {
    const el = document.getElementById('ta-clock');
    if (el) el.textContent = _taFmt(Math.floor((Date.now() - _taStart) / 1000));
  }, 1000);
}
function stopTimeAttack(){
  if (!_taActive) return;
  clearInterval(_taTimer); _taTimer = null;
  const elapsed = Math.floor((Date.now() - _taStart) / 1000);
  _taActive = false; _taStart = null;
  if (window._cm) window._cm.off('paste', _blockPaste);
  document.removeEventListener('paste', _blockPaste, true);
  const disp = document.getElementById('ta-display');
  const btn  = document.getElementById('ta-btn');
  if (disp) disp.style.display = 'none';
  if (btn)  btn.style.display  = '';
  alert(`타임어택 종료\n소요 시간: ${_taFmt(elapsed)}`);
}
// clean up timer when leaving problem page
function _taCleanup(){ if(_taActive){ clearInterval(_taTimer); _taTimer=null; _taActive=false; _taStart=null; document.removeEventListener('paste',_blockPaste,true); } }

function doReset(){
  const s = (_curProb && _curProb.starter) ? _curProb.starter : STARTER;
  code = s;
  if (window._cm){ window._cm.setValue(s); }
  else { const el=$('code-ta'); if(el) el.value=s; }
  tcResults = {};
  renderResults();
}

function renderDifficultyBtn(pid){

  if (!btn || curPid !== pid) return;
  const d = _difficulty[pid] || { count:0, voters:[] };
  const uid = firebaseUser ? firebaseUser.uid : null;
  const voted = uid && (d.voters || []).includes(uid);
  btn.innerHTML = voted
    ? `✓ 어려워요 취소 <b>${d.count || 0}</b>`
    : `😵 어려워요 <b>${d.count || 0}</b>`;
  btn.style.background = voted ? 'var(--warn-bg)' : '';
  btn.style.borderColor = voted ? 'var(--warn-border)' : '';

async function toggleDifficulty(pid){
  if (!firebaseUser) {
    alert('로그인 후 이용 가능합니다.');
    return;
  }
  const uid = firebaseUser.uid;
  const ref = db.collection('difficulty').doc(pid);
  const prev = _difficulty[pid] || { count:0, voters:[] };
  const prevVoters = Array.isArray(prev.voters) ? prev.voters : [];
  const has = prevVoters.includes(uid);

  // optimistic UI update (immediate)
  const newVoters = has ? prevVoters.filter(v => v !== uid) : [...prevVoters, uid];
  _difficulty[pid] = { count: newVoters.length, voters: newVoters };
  renderDifficultyBtn(pid);

  // sync to Firestore in background (server-side atomic operation)
  const FV = firebase.firestore.FieldValue;
  const op = has
    ? { count: FV.increment(-1), voters: FV.arrayRemove(uid) }
    : { count: FV.increment(1),  voters: FV.arrayUnion(uid) };
  try {
    await ref.set(op, { merge: true });
  } catch(e) {
    // rollback on failure
    console.warn('difficulty error', e);
    _difficulty[pid] = prev;
    renderDifficultyBtn(pid);
    alert('오류: ' + (e.message || e));
  }
}

let _ratings = {};  // { pid: { sum, count } }
const _RATINGS_CACHE_KEY = 'oj_ratings_cache_v1';
const _RATINGS_TTL = 60 * 60 * 1000;  // 60 min TTL

async function fetchRatings(force){
  // try localStorage cache (60 min TTL)
  if (!force) {
    try {
      const raw = localStorage.getItem(_RATINGS_CACHE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (Date.now() - obj.loadedAt < _RATINGS_TTL) {
          _ratings = obj.data || {};
          return;
        }
      }
    } catch(e) {}
  }
  if (!SHEETS_URL) return;
  try {
    const r = await fetch(SHEETS_URL + '?mode=ratings&key=' + SHEETS_KEY, { method:'GET', mode:'cors' });
    if (!r.ok) return;
    const d = await r.json();
    if (d.ratings) _ratings = d.ratings;
    try { localStorage.setItem(_RATINGS_CACHE_KEY, JSON.stringify({ data: _ratings, loadedAt: Date.now() })); } catch(e) {}
  } catch(e) {}
}

function rankArrow(name){
  if (!_prevLeaderboard.length) return '';
  const cur  = _leaderboard.findIndex(x => x.name === name);
  const prev = _prevLeaderboard.findIndex(x => x.name === name);
  if (prev === -1) return `<span style="font-size:9px;font-weight:700;color:var(--accent-text)">NEW</span>`;
  const diff = prev - cur;
  if (diff > 0) return `<span style="font-size:11px;color:#e53935;line-height:1">▲</span>`;
  if (diff < 0) return `<span style="font-size:11px;color:#1e88e5;line-height:1">▼</span>`;
  return '';
}

    const d = await r.json();
